<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}">
    <meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}">
    <title>문서 상신</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/topinfo.css}">
    <link rel="stylesheet" th:href="@{/css/menubar.css}">

    <link rel="stylesheet" th:href="@{/css/approval/approval-document.css}">
    <script th:src="@{/js/approval/approval-attachment-selector.js}"></script>
    <script th:src="@{/js/approval/approval-document-write.js}"></script>
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/business-workspace.css}">
</head>

<body class="workspace-home workspace-business business-approvals">
<a class="skip-link" href="#business-main">본문으로 이동</a>

<div th:replace="~{module/workspace :: userHeader}"></div>
<div th:replace="~{module/workspace :: sidebar('approvals')}"></div>

<div class="approval-page" id="business-main">

    <div class="page-head">
        <div>
            <span class="business-eyebrow">ELECTRONIC APPROVAL</span>
            <h1 class="page-title">문서 상신</h1>
            <p class="page-desc">게시글 작성 방식으로 문서를 작성하고 개인 결재라인을 선택합니다.</p>
        </div>

        <div class="button-row">
            <a class="btn" th:href="@{/approvals}" href="/approvals">목록</a>
        </div>
    </div>

    <div class="form-card">
        <div class="form-grid">

            <main>

                <!-- 제목 -->
                <div class="form-group">
                    <label class="form-label" for="documentTitle">제목</label>

                    <input class="form-control"
                           id="documentTitle"
                           type="text"
                           maxlength="200"
                           placeholder="문서 제목을 입력해주세요.">
                </div>


                <!-- 문서 양식 -->
                <div class="form-group">
                    <label class="form-label" for="documentTemplate">
                        문서 양식
                    </label>

                    <select id="documentTemplate"
                            class="document-template-select">

                        <option value="">문서 양식 선택</option>
                        <option value="vacation">휴가 신청서</option>
                        <option value="worklog">업무일지</option>
                        <option value="proposal">품의서</option>

                    </select>
                </div>


                <!-- ============================= -->
                <!-- 휴가 신청서 전용 영역 -->
                <!-- ============================= -->
                <div id="annualLeaveSection"
                     class="form-group"
                     style="display: none;">

                    <div style="
                        border: 1px solid #dfe5ec;
                        border-radius: 10px;
                        padding: 20px;
                        margin-bottom: 20px;
                        background: #f8fafc;
                    ">

                        <h3 style="
                            margin-top: 0;
                            margin-bottom: 18px;
                            font-size: 17px;
                        ">
                            휴가 정보
                        </h3>


                        <!-- 휴가 종류 -->
                        <div class="form-group">

                            <label class="form-label"
                                   for="leaveType">
                                휴가 종류
                            </label>

                            <select class="form-control"
                                    id="leaveType">

                                <option value="ANNUAL">
                                    연차
                                </option>

                                <option value="AM_HALF">
                                    오전 반차
                                </option>

                                <option value="PM_HALF">
                                    오후 반차
                                </option>

                            </select>

                        </div>


                        <!-- 시작일 -->
                        <div class="form-group">

                            <label class="form-label"
                                   for="leaveStartDate">
                                시작일
                            </label>

                            <input class="form-control"
                                   id="leaveStartDate"
                                   type="date">

                        </div>


                        <!-- 종료일 -->
                        <div class="form-group"
                             id="leaveEndDateGroup">

                            <label class="form-label"
                                   for="leaveEndDate">
                                종료일
                            </label>

                            <input class="form-control"
                                   id="leaveEndDate"
                                   type="date">

                        </div>


                        <!-- 예상 사용 일수 -->
                        <div class="form-group"
                             style="margin-bottom: 0;">

                            <label class="form-label">
                                예상 사용 일수
                            </label>

                            <div id="leaveDaysPreview"
                                 style="
                                     font-size: 20px;
                                     font-weight: 700;
                                     padding-top: 4px;
                                 ">
                                -
                            </div>

                            <div style="
                                margin-top: 6px;
                                font-size: 13px;
                                color: #6b7280;
                            ">
                                실제 사용 일수는 서버에서 다시 계산합니다.
                            </div>

                        </div>

                    </div>

                </div>


                <!-- 내용 -->
                <div class="form-group">

                    <label class="form-label"
                           for="documentContent">
                        내용
                    </label>

                    <textarea class="form-control"
                              id="documentContent"
                              maxlength="5000"
                              placeholder="결재 문서 내용을 입력해주세요."></textarea>

                </div>


                <!-- 첨부파일 -->
                <div class="form-group">

                    <label class="form-label"
                           for="documentFile">
                        첨부파일
                    </label>

                    <input class="form-control document-file-input"
                           id="documentFile"
                           type="file"
                           multiple>

                    <div id="selectedFileList"
                         class="selected-file-list">
                    </div>

                    <div class="file-help">
                        파일은 최대 5개까지 첨부할 수 있으며,
                        파일 하나당 최대 10MB까지 가능합니다.
                    </div>

                </div>

            </main>


            <!-- 우측 결재라인 -->
            <aside>

                <div class="side-box">

                    <h3 class="side-title">
                        결재라인
                    </h3>

                    <div class="form-group"
                         style="margin-bottom: 14px;">

                        <label class="form-label"
                               for="approvalLine">
                            개인 결재라인 선택
                        </label>

                        <select class="form-control"
                                id="approvalLine">

                            <option value="">
                                결재라인을 선택하세요
                            </option>

                            <option th:each="line : ${approvalLines}"
                                    th:value="${line.lineId}"
                                    th:text="${line.lineName}">
                            </option>

                        </select>

                    </div>


                    <div class="notice-box"
                         th:if="${#lists.isEmpty(approvalLines)}">

                        등록된 개인 결재라인이 없습니다.<br>

                        먼저

                        <a th:href="@{/approval-lines}"
                           href="/approval-lines">
                            결재라인 관리
                        </a>

                        에서 결재라인을 만들어주세요.

                    </div>


                    <div class="notice-box"
                         th:unless="${#lists.isEmpty(approvalLines)}">

                        저장해둔 개인 결재라인을 선택하면<br>
                        아래에서 결재 순서를 미리 확인할 수 있습니다.

                    </div>

                </div>


                <div class="side-box">

                    <h3 class="side-title">
                        결재 순서 미리보기
                    </h3>

                    <div class="approval-line-preview"
                         id="approvalLinePreview">

                        <div class="preview-empty">
                            결재라인을 선택해주세요.
                        </div>

                    </div>

                </div>

            </aside>

        </div>


        <!-- 하단 버튼 -->
        <div class="button-row"
             style="
                 justify-content: flex-end;
                 margin-top: 10px;
             ">

            <button class="btn"
                    id="draftButton"
                    type="button">
                임시저장
            </button>

            <button class="btn btn-primary"
                    id="submitButton"
                    type="button">
                상신
            </button>

        </div>

    </div>

</div>

</body>
</html>
