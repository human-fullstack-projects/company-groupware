<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta th:if="${_csrf != null}"
          name="_csrf"
          th:content="${_csrf.token}">

    <meta th:if="${_csrf != null}"
          name="_csrf_header"
          th:content="${_csrf.headerName}">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/topinfo.css}">
    <link rel="stylesheet" th:href="@{/css/menubar.css}">

    <link rel="stylesheet" th:href="@{/css/approval/approval-line.css}">

    <script defer th:src="@{/js/approval/approval-line.js}"></script>

    <title>결재라인 관리</title>


    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/business-workspace.css}">
</head>

<body class="workspace-home workspace-business business-lines">
<a class="skip-link" href="#business-main">본문으로 이동</a>

<div th:replace="~{module/workspace :: userHeader}"></div>
<div th:replace="~{module/workspace :: sidebar('lines')}"></div>


<main class="approval-line-page" id="business-main">
    <div class="container">

        <div class="business-heading"><span class="business-eyebrow">APPROVAL ROUTE</span><h1>결재라인 관리</h1><p>자주 사용하는 결재자와 결재 순서를 저장해두세요.</p></div>

        <div class="approval-box">

            <!-- 왼쪽 -->
            <div class="line-list-area">

                <button type="button"
                        class="btn-main"
                        onclick="newLine()">
                    + 새 결재라인
                </button>

                <div id="lineList"
                     class="line-list">
                </div>

            </div>


            <!-- 오른쪽 -->
            <div class="line-edit-area">

                <div class="form-group">

                    <label for="lineName">
                        결재라인 이름
                    </label>

                    <input type="text"
                           id="lineName"
                           maxlength="100"
                           placeholder="결재라인 이름">

                </div>


                <div class="form-group">

                    <label>
                        결재자 추가
                    </label>

                    <div class="employee-select">

                        <select id="employeeSelect" aria-label="추가할 결재자 선택">
                            <option value="">
                                사원을 선택하세요
                            </option>
                        </select>

                        <button type="button"
                                onclick="addApprover()">
                            추가
                        </button>

                    </div>

                </div>


                <div class="form-group">

                    <label>
                        결재 순서
                    </label>

                    <div id="approverList"
                         class="approver-list">
                    </div>

                </div>


                <div class="button-area">

                    <button type="button"
                            id="deleteButton"
                            class="btn-danger"
                            onclick="deleteLine()">
                        삭제
                    </button>

                    <button type="button"
                            class="btn-main"
                            onclick="saveLine()">
                        저장
                    </button>

                </div>

            </div>

        </div>

    </div>
</main>

</body>
</html>
