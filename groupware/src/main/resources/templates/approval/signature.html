<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<body>

<div th:fragment="signature" class="signature-module">

    <div class="signature-header">
        <div>
            <h3>개인 사인</h3>
            <p>
                전자결재에 사용할 개인 사인을 등록해주세요.
            </p>
        </div>
    </div>

    <!-- 사인 없음 -->
    <div id="signatureEmpty"
         class="signature-empty">
        등록된 사인이 없습니다.
    </div>

    <!-- 사인 있음 -->
    <div id="signaturePreviewArea"
         class="signature-preview-area"
         style="display:none;">

        <div class="signature-image-box">
            <img id="signaturePreview"
                 alt="개인 사인">
        </div>

    </div>

    <div class="signature-actions">

        <!-- 저장 버튼을 눌렀을 때 mypage 폼과 같이 전송 -->
        <input type="file"
               id="signatureFile"
               name="signatureFile"
               accept="image/png,image/jpeg,image/webp"
               hidden>

        <!-- 삭제 예약 여부 -->
        <input type="hidden"
               id="signatureDelete"
               name="signatureDelete"
               value="false">

        <button type="button"
                id="signatureUploadButton">
            사인 등록
        </button>

        <button type="button"
                id="signatureDeleteButton"
                class="signature-delete-button"
                style="display:none;">
            삭제
        </button>

    </div>

</div>

</body>
</html>
