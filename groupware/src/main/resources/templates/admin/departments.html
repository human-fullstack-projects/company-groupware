<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>부서 관리</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/topinfo.css}">
    <link rel="stylesheet" th:href="@{/css/menubar.css}">
    <link rel="stylesheet" th:href="@{/css/employee-search.css}">

    <style>
        body {
            margin-top: var(--topinfo-height);
            margin-left: var(--menubar-width);
        }

        main.admin-employee-content {
            padding: 24px 40px 60px;
        }

        .admin-employee-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1.page-title {
            margin: 0 0 4px;
            font-size: 22px;
            color: var(--color-navy-dark);
        }

        p.page-sub {
            margin: 0 0 24px;
            font-size: 13px;
            color: #868e96;
        }

        .flash-message {
            margin-bottom: 16px;
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
        }

        .flash-message.is-ok {
            background: #e9f5ee;
            color: #1e6b3c;
            border: 1px solid #bfe3cd;
        }

        .flash-message.is-error {
            background: #fbeaea;
            color: #9a2b2b;
            border: 1px solid #d9a3a3;
        }

        .dept-manage-section {
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 18px 20px;
            margin-bottom: 24px;
            background: #fcfcfd;
        }

        .dept-manage-section h2 {
            margin: 0 0 12px;
            font-size: 15px;
            color: var(--color-navy-dark);
        }

        .dept-add-form {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .dept-add-form input {
            height: 36px;
            padding: 0 12px;
            font-size: 14px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            width: 220px;
        }

        .dept-chip-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .dept-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 8px 6px 14px;
            border-radius: 999px;
            background: var(--color-white);
            border: 1px solid #dde1e4;
            font-size: 13px;
        }

        .dept-chip form {
            margin: 0;
        }

        .dept-chip .delete-btn {
            width: 20px;
            height: 20px;
            line-height: 18px;
            text-align: center;
            border-radius: 50%;
            border: 1px solid #d9a3a3;
            background: #fbeaea;
            color: #9a2b2b;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            padding: 0;
        }

        .dept-chip .delete-btn:hover {
            background: #f6dede;
        }

        .move-form {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .move-select {
            height: 32px;
            padding: 0 8px;
            font-size: 13px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            background: var(--color-white);
        }

        .action-btn {
            height: 32px;
            padding: 0 14px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 4px;
            cursor: pointer;
            background: var(--color-navy-dark);
            color: var(--color-white);
            border: 1px solid var(--color-navy-dark);
        }

        .action-btn:hover {
            background: var(--color-navy);
        }

        .modal-veil {
            position: fixed;
            inset: 0;
            background: rgba(16, 26, 51, .45);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }

        .modal-veil.is-open {
            display: flex;
        }

        .modal-box {
            width: min(360px, calc(100vw - 32px));
            background: var(--color-white);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 20px 50px rgba(16, 26, 51, .25);
        }

        .modal-box h2 {
            margin: 0 0 10px;
            font-size: 16px;
            color: var(--color-navy-dark);
        }

        .modal-box p {
            margin: 0 0 8px;
            font-size: 14px;
            color: #495057;
            line-height: 1.6;
        }

        .modal-box p b {
            color: var(--color-black);
        }

        .modal-warn {
            display: block;
            margin: 10px 0 20px;
            font-size: 12.5px;
            color: #9a2b2b;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 18px;
        }

        .modal-actions button {
            height: 36px;
            padding: 0 16px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 4px;
            cursor: pointer;
        }

        .modal-actions .cancel {
            background: var(--color-white);
            border: 1px solid #ced4da;
            color: #495057;
        }

        .modal-actions .confirm {
            background: var(--color-navy-dark);
            border: 1px solid var(--color-navy-dark);
            color: var(--color-white);
        }

        .modal-actions .confirm:hover {
            background: var(--color-navy);
        }

        .modal-actions .confirm.danger {
            background: #fbeaea;
            border: 1px solid #d9a3a3;
            color: #9a2b2b;
        }

        .modal-actions .confirm.danger:hover {
            background: #f6dede;
        }
    </style>
</head>

<body>

<div th:replace="~{module/topinfo :: topinfo}"></div>
<div th:replace="~{module/menubar :: menubar}"></div>

<main class="admin-employee-content">
    <div class="admin-employee-container">

        <h1 class="page-title">부서 관리</h1>
        <p class="page-sub">직원의 소속 부서를 다른 부서로 이동합니다.</p>

        <div th:if="${message}" class="flash-message is-ok" th:text="${message}"></div>
        <div th:if="${error}" class="flash-message is-error" th:text="${error}"></div>

        <section class="dept-manage-section">
            <h2>부서 목록 관리</h2>

            <form th:action="@{/admin/departments/add}" method="post" class="dept-add-form">
                <input type="text" name="deptName" placeholder="새 부서 이름" maxlength="20" required>
                <button type="submit" class="action-btn">부서 추가</button>
            </form>

            <div class="dept-chip-list">
                <div class="dept-chip" th:each="dept : ${departments}">
                    <span th:text="${dept.deptName}">부서명</span>
                    <form class="delete-action-form"
                          th:action="@{'/admin/departments/' + ${dept.deptId} + '/delete'}"
                          th:attr="data-dept-name=${dept.deptName}"
                          method="post">
                        <button type="submit" class="delete-btn" title="삭제">×</button>
                    </form>
                </div>
            </div>
        </section>

        <section class="search-filter-section">
            <form th:action="@{/admin/departments}" method="get" class="search-filter-form">

                <span class="search-filter-label">부서</span>
                <select name="departmentId" class="search-select">
                    <option value="">전체</option>
                    <option th:each="dept : ${departments}"
                            th:value="${dept.deptId}"
                            th:text="${dept.deptName}"
                            th:selected="${searchRequest != null and searchRequest.departmentId == dept.deptId}">
                    </option>
                </select>

                <input type="text"
                       name="emplName"
                       class="search-input"
                       placeholder="직원이름"
                       th:value="${searchRequest != null ? searchRequest.emplName : ''}">

                <button type="submit" class="search-btn">검색</button>
            </form>
        </section>

        <section class="employee-table-section">
            <table class="employee-table">
                <thead>
                <tr>
                    <th style="width: 8%;">사번</th>
                    <th style="width: 16%;">이름</th>
                    <th style="width: 16%;">아이디</th>
                    <th style="width: 16%;">현재 부서</th>
                    <th style="width: 12%;">직급</th>
                    <th style="width: 32%;">부서 이동</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="employee : ${employees}">
                    <td class="text-center" th:text="${employee.emplId}">1</td>
                    <td class="text-center" th:text="${employee.emplName}">홍길동</td>
                    <td class="text-center" th:text="${employee.loginId}">iamuserone</td>
                    <td class="text-center" th:text="${employee.departmentName}">부서명</td>
                    <td class="text-center" th:text="${employee.gradeName}">직급명</td>
                    <td class="text-center">
                        <form class="move-form move-action-form"
                              th:action="@{'/admin/employees/' + ${employee.emplId} + '/department'}"
                              th:attr="data-empl-name=${employee.emplName},data-login-id=${employee.loginId},data-current-dept=${employee.departmentName}"
                              method="post">
                            <select name="deptId" class="move-select">
                                <option th:each="dept : ${departments}"
                                        th:value="${dept.deptId}"
                                        th:text="${dept.deptName}"
                                        th:selected="${dept.deptId == employee.departmentId}">
                                </option>
                            </select>
                            <button type="submit" class="action-btn">이동</button>
                        </form>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(employees)}">
                    <td colspan="6" class="empty-result">조회된 직원 정보가 없습니다.</td>
                </tr>
                </tbody>
            </table>
        </section>

    </div>
</main>

<div class="modal-veil" id="moveModalVeil">
    <div class="modal-box">
        <h2>부서 이동</h2>
        <p id="moveModalBody"></p>
        <div class="modal-actions">
            <button type="button" class="cancel" id="moveModalCancel">취소</button>
            <button type="button" class="confirm" id="moveModalConfirm">확인</button>
        </div>
    </div>
</div>

<div class="modal-veil" id="deleteModalVeil">
    <div class="modal-box">
        <h2>부서 삭제</h2>
        <p id="deleteModalBody"></p>
        <span class="modal-warn">삭제 후에는 되돌릴 수 없습니다. 소속 직원이 있으면 삭제되지 않습니다.</span>
        <div class="modal-actions">
            <button type="button" class="cancel" id="deleteModalCancel">취소</button>
            <button type="button" class="confirm danger" id="deleteModalConfirm">삭제</button>
        </div>
    </div>
</div>

<script th:inline="none">
    (function () {
        function setupConfirm(formSelector, veilId, bodyId, confirmId, cancelId, buildBody) {
            var veil = document.getElementById(veilId);
            var bodyEl = document.getElementById(bodyId);
            var confirmBtn = document.getElementById(confirmId);
            var cancelBtn = document.getElementById(cancelId);
            var pendingForm = null;

            function closeModal() {
                veil.classList.remove('is-open');
                pendingForm = null;
            }

            document.querySelectorAll(formSelector).forEach(function (form) {
                form.addEventListener('submit', function (ev) {
                    if (form.dataset.confirmed === 'true') {
                        return;
                    }
                    ev.preventDefault();
                    buildBody(bodyEl, form);
                    pendingForm = form;
                    veil.classList.add('is-open');
                });
            });

            confirmBtn.addEventListener('click', function () {
                if (pendingForm) {
                    pendingForm.dataset.confirmed = 'true';
                    pendingForm.submit();
                }
                closeModal();
            });

            cancelBtn.addEventListener('click', closeModal);
            veil.addEventListener('click', function (ev) {
                if (ev.target === veil) closeModal();
            });
        }

        // 부서 이동 확인
        setupConfirm('form.move-action-form', 'moveModalVeil', 'moveModalBody', 'moveModalConfirm', 'moveModalCancel',
            function (bodyEl, form) {
                var select = form.querySelector('select[name="deptId"]');
                var toDept = select.options[select.selectedIndex].text;

                bodyEl.textContent = '';

                var nameEl = document.createElement('b');
                nameEl.textContent = form.dataset.emplName;
                bodyEl.appendChild(nameEl);
                bodyEl.appendChild(document.createTextNode('(' + form.dataset.loginId + ') 님의 부서를'));
                bodyEl.appendChild(document.createElement('br'));

                var fromEl = document.createElement('b');
                fromEl.textContent = form.dataset.currentDept;
                bodyEl.appendChild(fromEl);
                bodyEl.appendChild(document.createTextNode(' → '));

                var toEl = document.createElement('b');
                toEl.textContent = toDept;
                bodyEl.appendChild(toEl);
                bodyEl.appendChild(document.createTextNode('(으)로 변경하시겠습니까?'));
            });

        // 부서 삭제 확인
        setupConfirm('form.delete-action-form', 'deleteModalVeil', 'deleteModalBody', 'deleteModalConfirm', 'deleteModalCancel',
            function (bodyEl, form) {
                bodyEl.textContent = '';

                var nameEl = document.createElement('b');
                nameEl.textContent = form.dataset.deptName;
                bodyEl.appendChild(nameEl);
                bodyEl.appendChild(document.createTextNode(' 부서를 삭제하시겠습니까?'));
            });
    })();
</script>

</body>
</html>
