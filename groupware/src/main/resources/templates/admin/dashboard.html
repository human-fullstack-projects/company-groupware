<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>관리자 · COMPANY TALK</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/topinfo.css}">
    <link rel="stylesheet" th:href="@{/css/menubar.css}">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            margin-top: calc(var(--topinfo-height) + 40px);
            margin-left: calc(var(--menubar-width) + 40px);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 22px;
            color: var(--color-navy-dark);
        }

        .sub {
            margin: 0 0 30px;
            font-size: 13px;
            color: #888;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
        }

        .admin-card {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 20px;
            background: #fcfcfd;
            position: relative;
        }

        .admin-card__badge {
            position: absolute;
            top: 14px;
            right: 14px;
            font-size: 11px;
            font-weight: 700;
            color: #999;
            background: #eee;
            padding: 3px 8px;
            border-radius: 999px;
        }

        .admin-card__icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: var(--color-navy);
            color: var(--color-white);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 14px;
        }

        .admin-card__title {
            font-size: 15px;
            font-weight: 700;
            color: var(--color-navy-dark);
            margin-bottom: 6px;
        }

        h2 {
            margin: 40px 0 16px;
            font-size: 17px;
            color: var(--color-navy-dark);
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 40px 0 16px;
        }

        .section-header h2 {
            margin: 0;
        }

        .btn-detail {
            display: inline-block;
            font-size: 13px;
            font-weight: 700;
            color: var(--color-white);
            background: var(--color-navy);
            border-radius: 6px;
            padding: 8px 14px;
            text-decoration: none;
        }

        .btn-detail:hover {
            background: var(--color-navy-light);
        }

        .attendance-card {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 20px 24px;
            background: #fcfcfb;
            max-width: 480px;
        }

        .attendance-card__header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 8px;
        }

        .attendance-card__title {
            font-size: 14px;
            font-weight: 700;
            color: var(--color-navy-dark);
            margin-bottom: 6px;
        }

        .attendance-card__present {
            font-size: 13px;
            color: #52514e;
        }

        .attendance-card__present strong {
            font-size: 22px;
            color: var(--color-navy-dark);
            margin-right: 2px;
        }

        .attendance-card__date {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .attendance-card__date label {
            font-size: 11px;
            color: #898781;
        }

        .attendance-card__date input {
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 13px;
        }

        .attendance-card__body {
            display: flex;
            justify-content: center;
            padding-top: 8px;
        }

        .attendance-card__body canvas {
            max-width: 220px;
            max-height: 220px;
        }

    </style>
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/people-workspace.css}">
</head>

<body class="workspace-home workspace-people people-admin">
<a class="skip-link" href="#people-main">본문으로 이동</a>

<div th:replace="~{module/workspace :: userHeader}"></div>
<div th:replace="~{module/workspace :: sidebar('admin')}"></div>
<div class="people-content" id="people-main" role="main">
<div class="people-eyebrow">ADMIN WORKSPACE</div>
<nav class="people-tabs" aria-label="관리자 메뉴"><a th:href="@{/admin}" class="is-current" aria-current="page">개요</a><a th:href="@{/admin/employees}">직원계정</a><a th:href="@{/admin/departments}">부서</a><a th:href="@{/admin/grades}">직급</a><a th:href="@{/admin/commute}">근태</a></nav>

<h1>조직을 관리하는 한곳</h1>
<p class="sub">직원 계정부터 부서, 직급, 근태 현황까지 한눈에 확인하세요.</p>

<div class="card-grid">

    <a class="admin-card" th:href="@{/admin/employees}" style="text-decoration:none; display:block;">
        <div class="admin-card__icon">인</div>
        <div class="admin-card__title">직원계정 관리</div><p class="people-card-copy">직원 계정과 관리자 권한을 관리합니다.</p><span class="people-card-link">관리하기 <span aria-hidden="true">↗</span></span>
    </a>

    <a class="admin-card" th:href="@{/admin/departments}" style="text-decoration:none; display:block;">
        <div class="admin-card__icon">부</div>
        <div class="admin-card__title">부서 관리</div><p class="people-card-copy">부서 목록과 직원 소속을 정리합니다.</p><span class="people-card-link">관리하기 <span aria-hidden="true">↗</span></span>
    </a>

    <a class="admin-card" th:href="@{/admin/grades}" style="text-decoration:none; display:block;">
        <div class="admin-card__icon">직</div>
        <div class="admin-card__title">직급 관리</div><p class="people-card-copy">직급과 조직 내 순위를 관리합니다.</p><span class="people-card-link">관리하기 <span aria-hidden="true">↗</span></span>
    </a>

</div>

<div class="section-header">
    <h2>근태 관리</h2>
    <a class="btn-detail" th:href="@{/admin/commute}">세부 직원 근태관리</a>
</div>

<div class="attendance-card">
    <div class="attendance-card__header">
        <div>
            <div class="attendance-card__title">전체 직원 출근 현황</div>
            <div class="attendance-card__present">
                <strong id="presentCount" th:text="${commuteStats.presentCount}">0</strong>명 출근
            </div>
        </div>
        <div class="attendance-card__date">
            <label for="attendanceDate">조회 날짜</label>
            <input type="date" id="attendanceDate" th:value="${commuteStats.attendanceDate}">
        </div>
    </div>
    <div class="attendance-card__body">
        <canvas id="attendanceChart" width="220" height="220"></canvas>
    </div>
</div>

</div><!-- /people-content -->

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script th:inline="javascript">
    /*<![CDATA[*/
    const initialCommuteStats = /*[[${commuteStats}]]*/ {normalCount: 0, lateCount: 0, absentCount: 0, presentCount: 0};
    /*]]>*/

    let attendanceChart;

    function renderAttendanceChart(stats) {
        const data = [stats.normalCount, stats.lateCount, stats.absentCount];

        if (attendanceChart) {
            attendanceChart.data.datasets[0].data = data;
            attendanceChart.update();
        } else {
            const ctx = document.getElementById('attendanceChart').getContext('2d');
            attendanceChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['정상', '지각', '결근'],
                    datasets: [{
                        data: data,
                        backgroundColor: ['#0ca30c', '#fab219', '#d03b3b'],
                        borderColor: '#fcfcfb',
                        borderWidth: 2
                    }]
                },
                options: {
                    cutout: '60%',
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {boxWidth: 12, font: {size: 12}}
                        }
                    }
                }
            });
        }

        document.getElementById('presentCount').textContent = stats.presentCount;
    }

    document.addEventListener('DOMContentLoaded', function () {
        renderAttendanceChart(initialCommuteStats);

        document.getElementById('attendanceDate').addEventListener('change', function () {
            fetch('/admin/commute-stats?date=' + this.value)
                .then(function (res) { return res.json(); })
                .then(renderAttendanceChart);
        });
    });
</script>

</body>

</html>
