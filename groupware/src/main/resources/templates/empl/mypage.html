<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>마이페이지</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/topinfo.css}">
    <link rel="stylesheet" th:href="@{/css/menubar.css}">

    <meta th:if="${_csrf != null}"
          name="_csrf"
          th:content="${_csrf.token}">

    <meta th:if="${_csrf != null}"
          name="_csrf_header"
          th:content="${_csrf.headerName}">

    <script defer th:src="@{/js/approval/approval-signature.js}"></script>
    <link rel="stylesheet" th:href="@{/css/approval/approval-signature.css}">

    <style>
        body {
            margin-top: var(--topinfo-height);
            margin-left: var(--menubar-width);
        }

        main.mypage-content {
            padding: 24px 40px 60px;
        }

        .mypage-container {
            max-width: 640px;
            margin: 0 auto;
        }

        h1.page-title {
            margin: 0 0 4px;
            font-size: 22px;
            color: var(--color-navy-dark);
        }

        p.page-sub {
            margin: 0 0 24px;
            font-size: 13px;
            color: #868e96;
        }

        .flash-message {
            margin-bottom: 16px;
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
        }

        .flash-message.is-ok {
            background: #e9f5ee;
            color: #1e6b3c;
            border: 1px solid #bfe3cd;
        }

        .flash-message.is-error {
            background: #fbeaea;
            color: #9a2b2b;
            border: 1px solid #d9a3a3;
        }

        .info-card {
            border: 1px solid #e9ecef;
            border-radius: 10px;
            background: #fcfcfd;
            overflow: hidden;
        }

        .info-card__section-title {
            padding: 14px 20px;
            font-size: 13px;
            font-weight: 700;
            color: #868e96;
            background: #f1f3f5;
            border-bottom: 1px solid #e9ecef;
        }

        .info-row {
            display: flex;
            align-items: center;
            padding: 14px 20px;
            border-bottom: 1px solid #e9ecef;
            font-size: 14px;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-row__label {
            width: 110px;
            flex: none;
            color: #868e96;
            font-weight: 600;
        }

        .info-row__value {
            color: #212529;
        }

        .info-card__footer {
            padding: 16px 20px;
            display: flex;
            justify-content: flex-end;
        }

        .edit-btn {
            height: 36px;
            padding: 0 18px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 4px;
            cursor: pointer;
            background: var(--color-navy-dark);
            color: var(--color-white);
            border: 1px solid var(--color-navy-dark);
        }

        .edit-btn:hover {
            background: var(--color-navy);
        }

        /* 수정 모달 */
        .modal-veil {
            position: fixed;
            inset: 0;
            background: rgba(16, 26, 51, .45);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }

        .modal-veil.is-open {
            display: flex;
        }

        .modal-box {
            width: min(400px, calc(100vw - 32px));
            background: var(--color-white);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 20px 50px rgba(16, 26, 51, .25);
        }

        .modal-box h2 {
            margin: 0 0 16px;
            font-size: 16px;
            color: var(--color-navy-dark);
        }

        .form-field {
            margin-bottom: 14px;
        }

        .form-field label {
            display: block;
            font-size: 12.5px;
            font-weight: 700;
            color: #868e96;
            margin-bottom: 6px;
        }

        .form-field input {
            width: 100%;
            height: 38px;
            padding: 0 12px;
            font-size: 14px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .form-field input:focus {
            border-color: #0d6efd;
            outline: none;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 18px;
        }

        .modal-actions button {
            height: 36px;
            padding: 0 16px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 4px;
            cursor: pointer;
        }

        .modal-actions .cancel {
            background: var(--color-white);
            border: 1px solid #ced4da;
            color: #495057;
        }

        .modal-actions .confirm {
            background: var(--color-navy-dark);
            border: 1px solid var(--color-navy-dark);
            color: var(--color-white);
        }

        /*------------------------*/
        .info-row--signature {
            align-items: center;
        }
        .signature-readonly {
            display: flex;
            align-items: center;
            min-height: 70px;
        }

        .signature-readonly img {
            max-width: 150px;
            max-height: 70px;
            object-fit: contain;
        }
    </style>
</head>

<body>

<div th:replace="~{module/topinfo :: topinfo}"></div>
<div th:replace="~{module/menubar :: menubar}"></div>

<main class="mypage-content">
    <div class="mypage-container">

        <h1 class="page-title">마이페이지</h1>
        <p class="page-sub">내 정보를 확인하고, 연락처·주소·이메일을 직접 수정할 수 있습니다.</p>

        <div th:if="${message}" class="flash-message is-ok" th:text="${message}"></div>
        <div th:if="${error}" class="flash-message is-error" th:text="${error}"></div>

        <div class="info-card">
            <div class="info-card__section-title">기본 정보 (수정 불가)</div>

            <div class="info-row">
                <span class="info-row__label">가입일</span>
                <span class="info-row__value"
                      th:text="${employee.createdAt != null} ? ${#temporals.format(employee.createdAt, 'yyyy-MM-dd')} : '정보 없음'">2026-09-14</span>
            </div>
            <div class="info-row">
                <span class="info-row__label">직급</span>
                <span class="info-row__value"
                      th:text="${employee.grade != null ? employee.grade.gradeName : '-'}">사원</span>
            </div>
            <div class="info-row">
                <span class="info-row__label">부서</span>
                <span class="info-row__value"
                      th:text="${employee.department != null ? employee.department.deptName : '-'}">개발팀</span>
            </div>
            <div class="info-row">
                <span class="info-row__label">이름</span>
                <span class="info-row__value" th:text="${employee.emplName}">홍길동</span>
            </div>

            <div class="info-card__section-title">개인 정보 (본인 수정 가능)</div>

            <div class="info-row">
                <span class="info-row__label">연락처</span>
                <span class="info-row__value" th:text="${employee.emplPhone != null ? employee.emplPhone : '-'}">010-0000-0000</span>
            </div>
            <div class="info-row">
                <span class="info-row__label">주소</span>
                <span class="info-row__value" th:text="${employee.address != null ? employee.address : '-'}">-</span>
            </div>
            <div class="info-row">
                <span class="info-row__label">이메일</span>
                <span class="info-row__value" th:text="${employee.emplEmail != null ? employee.emplEmail : '-'}">user@company.com</span>
            </div>

            <div class="info-row">
                <span class="info-row__label">개인 사인</span>

                <div class="signature-readonly">
                    <img th:if="${hasSignature}"
                         th:src="@{/approval-signatures/image}"
                         alt="개인 사인">

                    <span th:unless="${hasSignature}">-</span>
                </div>
            </div>

            <div class="info-card__footer">
                <button type="button" class="edit-btn" id="openEditBtn">정보 수정</button>
            </div>
        </div>

    </div>
</main>

<div class="modal-veil" id="editModalVeil">
    <div class="modal-box">
        <h2>내 정보 수정</h2>
        <form id="mypageEditForm" th:action="@{/mypage}" method="post" enctype="multipart/form-data">
            <div class="form-field">
                <label for="emplPhone">연락처</label>
                <input type="text" id="emplPhone" name="emplPhone" placeholder="010-0000-0000"
                       th:value="${employee.emplPhone}">
            </div>
            <div class="form-field">
                <label for="address">주소</label>
                <input type="text" id="address" name="address" placeholder="주소를 입력하세요"
                       th:value="${employee.address}">
            </div>
            <div class="form-field">
                <label for="emplEmail">이메일</label>
                <input type="text" id="emplEmail" name="emplEmail" placeholder="user@company.com"
                       th:value="${employee.emplEmail}">
            </div>

            <div class="form-field">
                <div th:replace="~{approval/signature :: signature}"></div>
            </div>

            <div class="modal-actions">
                <button type="button" class="cancel" id="closeEditBtn">취소</button>
                <button type="submit" class="confirm">저장</button>
            </div>
        </form>
    </div>
</div>

<script th:inline="none">
    (function () {
        var veil = document.getElementById('editModalVeil');
        var openBtn = document.getElementById('openEditBtn');
        var closeBtn = document.getElementById('closeEditBtn');

        openBtn.addEventListener('click', function () {
            veil.classList.add('is-open');
        });
        closeBtn.addEventListener('click', function () {
            veil.classList.remove('is-open');
        });
        veil.addEventListener('click', function (ev) {
            if (ev.target === veil) veil.classList.remove('is-open');
        });
    })();
</script>

</body>
</html>
