<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>게시글 수정</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/topinfo.css}">
    <link rel="stylesheet" th:href="@{/css/menubar.css}">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            margin-top: calc(var(--topinfo-height) + 40px);
            margin-left: calc(var(--menubar-width) + 40px);
        }

        h1 {
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input[type="text"] {
            width: 500px;
            padding: 10px;
            box-sizing: border-box;
        }

        textarea {
            width: 500px;
            height: 300px;
            padding: 10px;
            box-sizing: border-box;
            resize: vertical;
        }

        .buttons {
            margin-top: 20px;
        }

        button {
            padding: 8px 15px;
            cursor: pointer;
        }

        a {
            margin-left: 10px;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div th:replace="~{module/topinfo :: topinfo}"></div>
<div th:replace="~{module/menubar :: menubar}"></div>

<h1>게시글 수정</h1>

<form th:action="@{/boards/{boardId}/edit(boardId=${board.boardId})}"
      method="post">

    <!-- 제목 -->
    <div class="form-group">

        <label for="boardTitle">
            제목
        </label>

        <input type="text"
               id="boardTitle"
               name="boardTitle"
               th:value="${board.boardTitle}"
               required>

    </div>

    <!-- 내용 -->
    <div class="form-group">

        <label for="boardContent">
            내용
        </label>

        <textarea id="boardContent"
                  name="boardContent"
                  required
                  th:text="${board.boardContent}"></textarea>

    </div>

    <!-- 버튼 -->
    <div class="buttons">

        <button type="submit">
            수정
        </button>

        <a th:href="@{/boards/{boardId}(boardId=${board.boardId})}">
            취소
        </a>

    </div>

</form>

</body>

</html>
