<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>게시글 상세</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/topinfo.css}">
    <link rel="stylesheet" th:href="@{/css/menubar.css}">


    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/workspace-pages.css}">
</head>

<body class="workspace-home workspace-board">
<a class="skip-link" href="#workspace-main">본문으로 건너뛰기</a>

<div th:replace="~{module/workspace :: header}"></div>
<div th:replace="~{module/workspace :: sidebar('boards')}"></div>
<main class="workspace-content board-view board-detail" id="workspace-main">

<header class="workspace-page-heading"><span class="home-eyebrow">TEAM BOARD</span><h1>게시글 상세</h1><p>업무 내용을 확인하고 댓글로 의견을 나누세요.</p></header>
<section class="board-panel" aria-label="게시판 상세">

<div class="title"
     th:text="${board.boardTitle}">
    게시글 제목
</div>

<div class="info">

    카테고리 :
    <span th:text="${board.boardCategory != null ? board.boardCategory.boardCategoryName : '-'}">
        카테고리
    </span>

    |

    작성자 :
    <span th:text="${board.employee != null ? board.employee.emplName : '-'}">
        작성자
    </span>

    |

    작성일 :
    <span th:text="${board.createdAt != null ? #temporals.format(board.createdAt, 'yyyy-MM-dd HH시mm분') : '-'}">
        2026-09-09
    </span>

    |

    조회수 :
    <span th:text="${board.readCount}">
        0
    </span>

    <span th:if="${board.updatedAt != null}">
        |
        수정일 :
        <span th:text="${#temporals.format(board.updatedAt, 'yyyy-MM-dd HH시mm분')}">
            2026-09-09
        </span>
    </span>

</div>

<div class="content"
     th:text="${board.boardContent}">
    게시글 내용
</div>

<!-- 첨부파일 -->
<div class="file-area">

    <h3>첨부파일</h3>

    <!-- 첨부파일이 있는 경우 -->
    <ul class="file-list"
        th:if="${!#lists.isEmpty(boardFiles)}">

        <li th:each="file : ${boardFiles}">

            <a th:href="@{/boards/files/{boardFileId}/download(boardFileId=${file.boardFileId})}"
               th:text="${file.boardFileOriginName}">
                첨부파일
            </a>

            <span class="file-size"
                  th:text="${'(' + file.boardFileSize + ' bytes)'}">
                (0 bytes)
            </span>

        </li>

    </ul>

    <!-- 첨부파일이 없는 경우 -->
    <div class="no-file"
         th:if="${#lists.isEmpty(boardFiles)}">

        첨부파일이 없습니다.

    </div>

</div>

<div th:replace="~{board/comment :: commentModule(boardId=${board.boardId})}"></div>

<div class="buttons">

    <!-- 목록 -->
    <a th:href="@{/boards}">
        <button type="button">
            목록
        </button>
    </a>

    <!-- 수정 -->
    <a th:if="${canModify}" th:href="@{/boards/{boardId}/edit(boardId=${board.boardId})}">
        <button type="button">
            수정
        </button>
    </a>

    <!-- 삭제 -->
    <form th:if="${canModify}"
          class="delete-form"
          th:action="@{/boards/{boardId}/delete(boardId=${board.boardId})}"
          method="post"
          onsubmit="return confirm('정말 삭제하시겠습니까?');">

        <button type="submit">
            삭제
        </button>

    </form>

</div>

</section>
</main>
</body>

</html>
