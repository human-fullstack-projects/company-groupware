<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>게시판</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/topinfo.css}">
    <link rel="stylesheet" th:href="@{/css/menubar.css}">


    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/workspace-pages.css}">
</head>

<body class="workspace-home workspace-board">
<a class="skip-link" href="#workspace-main">본문으로 건너뛰기</a>

<div th:replace="~{module/workspace :: header}"></div>
<div th:replace="~{module/workspace :: sidebar('boards')}"></div>
<main class="workspace-content board-view board-list" id="workspace-main">

<header class="workspace-page-heading"><span class="home-eyebrow">TEAM BOARD</span><h1>게시판</h1><p>공지와 부서 소식을 한곳에서 확인하세요.</p></header>
<section class="board-panel" aria-label="게시판 목록">

<!-- 카테고리 필터 -->
<div class="category-filter">

    <a th:each="category : ${categories}"
       th:if="${category.boardCategoryName == '공지'}"
       th:href="@{/boards(categoryId=${category.boardCategoryId})}"
       th:text="${category.boardCategoryName}"
       th:classappend="${categoryId != null and categoryId == category.boardCategoryId} ? ' active' : ''"
       class="filter-pill">
    </a>

    <select aria-label="부서 게시판 선택" class="dept-select" onchange="location.href='/boards?categoryId=' + this.value">
        <option value="">부서</option>

        <optgroup label="게시판">
            <option th:each="category : ${categories}"
                    th:if="${category.boardCategoryName != '자유게시판' and !#strings.endsWith(category.boardCategoryName, '공지')}"
                    th:value="${category.boardCategoryId}"
                    th:selected="${categoryId != null and categoryId == category.boardCategoryId}"
                    th:text="${category.boardCategoryName}">
            </option>
        </optgroup>

        <optgroup label="공지">
            <option th:each="category : ${categories}"
                    th:if="${category.boardCategoryName != '공지' and #strings.endsWith(category.boardCategoryName, '공지')}"
                    th:value="${category.boardCategoryId}"
                    th:selected="${categoryId != null and categoryId == category.boardCategoryId}"
                    th:text="${category.boardCategoryName}">
            </option>
        </optgroup>
    </select>

    <a th:each="category : ${categories}"
       th:if="${category.boardCategoryName == '자유게시판'}"
       th:href="@{/boards(categoryId=${category.boardCategoryId})}"
       th:text="${category.boardCategoryName}"
       th:classappend="${categoryId != null and categoryId == category.boardCategoryId} ? ' active' : ''"
       class="filter-pill">
    </a>

</div>

<!-- 검색 -->
<div class="search-area">

    <form th:action="@{/boards}" method="get">

        <input type="hidden" name="categoryId" th:value="${categoryId}">

        <select name="searchType" aria-label="검색 기준">
            <option value="all" th:selected="${searchType == 'all'}">전체</option>
            <option value="title" th:selected="${searchType == 'title'}">제목</option>
            <option value="content" th:selected="${searchType == 'content'}">내용</option>
            <option value="author" th:selected="${searchType == 'author'}">작성자</option>
        </select>

        <input type="text"
               name="keyword" aria-label="검색어"
               th:value="${keyword}"
               placeholder="검색어 입력">

        <button type="submit">검색</button>

    </form>

</div>

<div class="board-table-scroll"><table class="board-table">

    <thead>
    <tr>
        <th>번호</th>
        <th>제목</th>
        <th>카테고리</th>
        <th>작성자</th>
        <th>작성일</th>
        <th>조회수</th>
    </tr>
    </thead>

    <tbody>

    <!-- 게시글이 존재하는 경우 -->
    <tr th:each="board : ${boardPage.content}"
        th:classappend="${readBoardIds.contains(board.boardId)} ? 'read-row' : ''">

        <td th:text="${board.boardId}">
            1
        </td>

        <td class="title">
            <a th:href="@{/boards/{boardId}(boardId=${board.boardId})}"
               th:text="${board.boardTitle}">
                게시글 제목
            </a>
        </td>

        <td th:text="${board.boardCategory != null ? board.boardCategory.boardCategoryName : '-'}">
            카테고리
        </td>

        <td th:text="${board.employee != null ? board.employee.emplName : '-'}">
            작성자
        </td>

        <td th:text="${board.createdAt != null ? #temporals.format(board.createdAt, 'yyyy-MM-dd HH시mm분') : '-'}">
            2026-09-09
        </td>

        <td th:text="${board.readCount}">
            0
        </td>

    </tr>

    <!-- 게시글이 없는 경우 -->
    <tr th:if="${boardPage.empty}">

        <td colspan="6" class="empty-message">
            등록된 게시글이 없습니다.
        </td>

    </tr>

    </tbody>

</table></div>

<!-- 페이지네이션 -->
<div class="pagination" th:if="${boardPage.totalPages > 0}">

    <!-- 이전 -->
    <span class="disabled" th:if="${boardPage.first}">
        이전
    </span>

    <a th:if="${!boardPage.first}"
       th:href="@{/boards(page=${currentPage - 1}, keyword=${keyword}, searchType=${searchType}, categoryId=${categoryId})}">
        이전
    </a>

    <!-- 페이지 번호 -->
    <span th:each="pageNumber : ${#numbers.sequence(startPage, endPage)}">

        <span class="current"
              th:if="${pageNumber == currentPage}"
              th:text="${pageNumber + 1}">
            1
        </span>

        <a th:if="${pageNumber != currentPage}"
           th:href="@{/boards(page=${pageNumber}, keyword=${keyword}, searchType=${searchType}, categoryId=${categoryId})}"
           th:text="${pageNumber + 1}">
            2
        </a>

    </span>

    <!-- 다음 -->
    <span class="disabled" th:if="${boardPage.last}">
        다음
    </span>

    <a th:if="${!boardPage.last}"
       th:href="@{/boards(page=${currentPage + 1}, keyword=${keyword}, searchType=${searchType}, categoryId=${categoryId})}">
        다음
    </a>

</div>

<!-- 글쓰기 버튼 -->
<div class="button-area">

    <a class="write-button"
       th:href="@{/boards/create}">
        글쓰기
    </a>

</div>

</section>
</main>
</body>

</html>
