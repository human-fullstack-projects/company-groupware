<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>게시판</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/topinfo.css}">
    <link rel="stylesheet" th:href="@{/css/menubar.css}">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            margin-top: calc(var(--topinfo-height) + 40px);
            margin-left: calc(var(--menubar-width) + 40px);
        }

        h1 {
            margin-bottom: 30px;
        }

        .category-filter {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .filter-pill {
            display: inline-block;
            border: 1px solid #ccc;
            border-radius: 999px;
            padding: 9px 20px;
            font-size: 14px;
            font-weight: 600;
            color: #555;
            background-color: #fff;
            text-decoration: none;
        }

        .filter-pill.active {
            background-color: var(--color-navy);
            border-color: var(--color-navy);
            color: #fff;
        }

        .dept-select {
            border: 1px solid #ccc;
            border-radius: 999px;
            padding: 9px 14px;
            font-size: 14px;
            font-weight: 600;
            color: #555;
            background-color: #fff;
        }

        .search-area {
            margin-bottom: 20px;
            text-align: right;
        }

        .search-area input {
            width: 250px;
            padding: 8px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        .search-area button {
            padding: 8px 15px;
            cursor: pointer;
        }

        .board-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        .board-table th,
        .board-table td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }

        .board-table th {
            background-color: #f5f5f5;
        }

        .board-table td.title {
            text-align: left;
        }

        .board-table a {
            color: #333;
            text-decoration: none;
        }

        .board-table a:hover {
            text-decoration: underline;
        }

        .button-area {
            text-align: right;
        }

        .write-button {
            display: inline-block;
            padding: 10px 18px;
            background-color: #333;
            color: white !important;
            text-decoration: none !important;
            border-radius: 4px;
        }

        .write-button:hover {
            background-color: #555;
        }

        .empty-message {
            text-align: center;
            padding: 50px 0;
            color: #777;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
            margin: 30px 0;
        }

        .pagination a,
        .pagination span {
            display: inline-block;
            min-width: 32px;
            padding: 7px 10px;
            box-sizing: border-box;
            border: 1px solid #ddd;
            text-align: center;
            text-decoration: none;
        }

        .pagination a {
            color: #333;
        }

        .pagination a:hover {
            background-color: #f5f5f5;
        }

        .pagination .current {
            background-color: #333;
            color: white;
            border-color: #333;
        }

        .pagination .disabled {
            color: #aaa;
            background-color: #f5f5f5;
        }

        .read-row td {
            color: #999;
            background-color: #fafafa;
        }
    </style>
</head>

<body>

<div th:replace="~{module/topinfo :: topinfo}"></div>
<div th:replace="~{module/menubar :: menubar}"></div>

<h1>게시판</h1>

<!-- 카테고리 필터 -->
<div class="category-filter">

    <a th:each="category : ${categories}"
       th:if="${category.boardCategoryName == '공지'}"
       th:href="@{/boards(categoryId=${category.boardCategoryId})}"
       th:text="${category.boardCategoryName}"
       th:classappend="${categoryId != null and categoryId == category.boardCategoryId} ? ' active' : ''"
       class="filter-pill">
    </a>

    <select class="dept-select" onchange="location.href='/boards?categoryId=' + this.value">
        <option value="">부서</option>

        <optgroup label="게시판">
            <option th:each="category : ${categories}"
                    th:if="${category.boardCategoryName != '자유게시판' and !#strings.endsWith(category.boardCategoryName, '공지')}"
                    th:value="${category.boardCategoryId}"
                    th:selected="${categoryId != null and categoryId == category.boardCategoryId}"
                    th:text="${category.boardCategoryName}">
            </option>
        </optgroup>

        <optgroup label="공지">
            <option th:each="category : ${categories}"
                    th:if="${category.boardCategoryName != '공지' and #strings.endsWith(category.boardCategoryName, '공지')}"
                    th:value="${category.boardCategoryId}"
                    th:selected="${categoryId != null and categoryId == category.boardCategoryId}"
                    th:text="${category.boardCategoryName}">
            </option>
        </optgroup>
    </select>

    <a th:each="category : ${categories}"
       th:if="${category.boardCategoryName == '자유게시판'}"
       th:href="@{/boards(categoryId=${category.boardCategoryId})}"
       th:text="${category.boardCategoryName}"
       th:classappend="${categoryId != null and categoryId == category.boardCategoryId} ? ' active' : ''"
       class="filter-pill">
    </a>

</div>

<!-- 검색 -->
<div class="search-area">

    <form th:action="@{/boards}" method="get">

        <input type="hidden" name="categoryId" th:value="${categoryId}">

        <select name="searchType">
            <option value="all" th:selected="${searchType == 'all'}">전체</option>
            <option value="title" th:selected="${searchType == 'title'}">제목</option>
            <option value="content" th:selected="${searchType == 'content'}">내용</option>
            <option value="author" th:selected="${searchType == 'author'}">작성자</option>
        </select>

        <input type="text"
               name="keyword"
               th:value="${keyword}"
               placeholder="검색어 입력">

        <button type="submit">검색</button>

    </form>

</div>

<table class="board-table">

    <thead>
    <tr>
        <th>번호</th>
        <th>제목</th>
        <th>카테고리</th>
        <th>작성자</th>
        <th>작성일</th>
        <th>조회수</th>
    </tr>
    </thead>

    <tbody>

    <!-- 게시글이 존재하는 경우 -->
    <tr th:each="board : ${boardPage.content}"
        th:classappend="${readBoardIds.contains(board.boardId)} ? 'read-row' : ''">

        <td th:text="${board.boardId}">
            1
        </td>

        <td class="title">
            <a th:href="@{/boards/{boardId}(boardId=${board.boardId})}"
               th:text="${board.boardTitle}">
                게시글 제목
            </a>
        </td>

        <td th:text="${board.boardCategory != null ? board.boardCategory.boardCategoryName : '-'}">
            카테고리
        </td>

        <td th:text="${board.employee != null ? board.employee.emplName : '-'}">
            작성자
        </td>

        <td th:text="${board.createdAt != null ? #temporals.format(board.createdAt, 'yyyy-MM-dd HH시mm분') : '-'}">
            2026-09-09
        </td>

        <td th:text="${board.readCount}">
            0
        </td>

    </tr>

    <!-- 게시글이 없는 경우 -->
    <tr th:if="${boardPage.empty}">

        <td colspan="6" class="empty-message">
            등록된 게시글이 없습니다.
        </td>

    </tr>

    </tbody>

</table>

<!-- 페이지네이션 -->
<div class="pagination" th:if="${boardPage.totalPages > 0}">

    <!-- 이전 -->
    <span class="disabled" th:if="${boardPage.first}">
        이전
    </span>

    <a th:if="${!boardPage.first}"
       th:href="@{/boards(page=${currentPage - 1}, keyword=${keyword}, searchType=${searchType}, categoryId=${categoryId})}">
        이전
    </a>

    <!-- 페이지 번호 -->
    <span th:each="pageNumber : ${#numbers.sequence(startPage, endPage)}">

        <span class="current"
              th:if="${pageNumber == currentPage}"
              th:text="${pageNumber + 1}">
            1
        </span>

        <a th:if="${pageNumber != currentPage}"
           th:href="@{/boards(page=${pageNumber}, keyword=${keyword}, searchType=${searchType}, categoryId=${categoryId})}"
           th:text="${pageNumber + 1}">
            2
        </a>

    </span>

    <!-- 다음 -->
    <span class="disabled" th:if="${boardPage.last}">
        다음
    </span>

    <a th:if="${!boardPage.last}"
       th:href="@{/boards(page=${currentPage + 1}, keyword=${keyword}, searchType=${searchType}, categoryId=${categoryId})}">
        다음
    </a>

</div>

<!-- 글쓰기 버튼 -->
<div class="button-area">

    <a class="write-button"
       th:href="@{/boards/create}">
        글쓰기
    </a>

</div>

</body>

</html>
