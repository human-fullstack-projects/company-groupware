<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>게시글 작성</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/topinfo.css}">
    <link rel="stylesheet" th:href="@{/css/menubar.css}">


    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/workspace-pages.css}">
</head>

<body class="workspace-home workspace-board">
<a class="skip-link" href="#workspace-main">본문으로 건너뛰기</a>

<div th:replace="~{module/workspace :: header}"></div>
<div th:replace="~{module/workspace :: sidebar('boards')}"></div>
<main class="workspace-content board-view board-create" id="workspace-main">

<header class="workspace-page-heading"><span class="home-eyebrow">SHARE WITH YOUR TEAM</span><h1>게시글 작성</h1><p>업무에 필요한 내용을 동료와 공유하세요.</p></header>
<section class="board-panel" aria-label="게시판 작성">

<p class="error"
   style="color:#c62828;"
   th:if="${errorMessage != null}"
   th:text="${errorMessage}">
</p>

<form th:action="@{/boards}"
      method="post"
      enctype="multipart/form-data">

    <!-- 제목 -->
    <div class="form-group">

        <label for="boardTitle">
            제목
        </label>

        <input type="text"
               id="boardTitle"
               name="boardTitle"
               maxlength="50"
               required>

    </div>

    <!-- 카테고리 -->
    <div class="form-group">

        <label for="categoryId">
            카테고리
        </label>

        <select id="categoryId"
                name="categoryId">

            <option value="">
                카테고리 선택
            </option>

            <optgroup label="전체">
                <option th:each="category : ${categories}"
                        th:if="${category.boardCategoryName == '자유게시판' or category.boardCategoryName == '공지'}"
                        th:value="${category.boardCategoryId}"
                        th:text="${category.boardCategoryName}">
                    카테고리
                </option>
            </optgroup>

            <optgroup label="부서 게시판">
                <option th:each="category : ${categories}"
                        th:if="${category.boardCategoryName != '자유게시판' and !#strings.endsWith(category.boardCategoryName, '공지')}"
                        th:value="${category.boardCategoryId}"
                        th:text="${category.boardCategoryName}">
                    카테고리
                </option>
            </optgroup>

            <optgroup label="부서 공지">
                <option th:each="category : ${categories}"
                        th:if="${category.boardCategoryName != '공지' and #strings.endsWith(category.boardCategoryName, '공지')}"
                        th:value="${category.boardCategoryId}"
                        th:text="${category.boardCategoryName}">
                    카테고리
                </option>
            </optgroup>

        </select>

    </div>

    <!-- 내용 -->
    <div class="form-group">

        <label for="boardContent">
            내용
        </label>

        <textarea id="boardContent"
                  name="boardContent"
                  required></textarea>

    </div>

    <!-- 첨부파일 -->
    <div class="form-group">

        <label for="files">
            첨부파일
        </label>

        <input type="file"
               id="files"
               name="files"
               multiple>

        <div>
            여러 개의 파일을 선택할 수 있습니다.
        </div>

    </div>

    <!-- 버튼 -->
    <button type="submit">
        등록
    </button>

    <a href="/boards">
        취소
    </a>

</form>

</section>
</main>
</body>

</html>
