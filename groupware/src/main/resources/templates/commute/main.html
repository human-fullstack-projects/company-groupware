<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>출퇴근</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/topinfo.css}">
    <link rel="stylesheet" th:href="@{/css/menubar.css}">
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/business-workspace.css}">
</head>
<body class="workspace-home workspace-business business-commute">
<a class="skip-link" href="#business-main">본문으로 이동</a>

<div th:replace="~{module/workspace :: userHeader}"></div>
<div th:replace="~{module/workspace :: sidebar('commute')}"></div>

<main class="commute-main" id="business-main">
    <div class="business-heading"><span class="business-eyebrow">ATTENDANCE</span><h1>근태 관리</h1><p>오늘의 출퇴근을 기록하고 근무 상태를 확인하세요.</p></div>
    <section class="attendance-card" aria-label="오늘의 출퇴근">
    <div class="attendance-intro"><span class="business-eyebrow">MY WORKDAY</span><h2>오늘의 근무</h2>
    <p th:if="${commuteState == 'NOT_CHECKED_IN'}">업무를 시작할 준비가 되셨나요?</p>
    <p th:if="${commuteState == 'CHECKED_IN'}">근무 중입니다. 업무를 마치면 퇴근을 기록하세요.</p>
    <p th:if="${commuteState == 'CHECKED_OUT'}">오늘도 수고하셨습니다.</p></div>

    <!-- 에러 메시지 (중복 출근/퇴근 시도 등) -->
    <div class="error-box" role="alert" th:if="${errorMessage != null}" th:text="${errorMessage}"></div>

    <!-- 출근 전: 출근 버튼 -->
    <form th:if="${commuteState == 'NOT_CHECKED_IN'}" method="post" th:action="@{/commute/check-in}">
        <input type="hidden" name="emplId" th:value="${emplId}">
        <button type="submit" class="commute-btn commute-btn--checkin">출근</button>
    </form>

    <!-- 출근 완료, 퇴근 전: 퇴근 버튼 -->
    <form th:if="${commuteState == 'CHECKED_IN'}" method="post" th:action="@{/commute/check-out}">
        <input type="hidden" name="emplId" th:value="${emplId}">
        <button type="submit" class="commute-btn commute-btn--checkout">퇴근</button>
    </form>

    <!-- 퇴근 완료: 버튼 대신 안내만 표시 -->
    <div th:if="${commuteState == 'CHECKED_OUT'}" class="commute-done">
        오늘 근무가<br>종료되었습니다
    </div>

    <table class="info-table">
        <tr>
            <td class="label">출근시간</td>
            <td class="value" th:text="${today != null and today.startTime != null} ? ${today.startTime} : '출근 안함'"></td>
        </tr>
        <tr>
            <td class="label">퇴근시간</td>
            <td class="value" th:text="${today != null and today.finishTime != null} ? ${today.finishTime} : '퇴근 안함'"></td>
        </tr>
    </table>
    <p class="attendance-note">출퇴근 시간은 버튼을 누른 뒤 서버에서 처리된 기록으로 표시됩니다.</p>
    </section>
</main>

</body>
</html>
