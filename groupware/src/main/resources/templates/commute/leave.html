<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1">

    <title>연차 관리</title>


    <link
            rel="stylesheet"
            th:href="@{/css/common.css}">

    <link
            rel="stylesheet"
            th:href="@{/css/topinfo.css}">

    <link
            rel="stylesheet"
            th:href="@{/css/menubar.css}">

    <link
            rel="stylesheet"
            th:href="@{/css/home.css}">

    <link
            rel="stylesheet"
            th:href="@{/css/business-workspace.css}">


    <style>

        .leave-page {
            margin-top: var(--topinfo-height);
            margin-left: var(--menubar-width);
            min-height: calc(100vh - var(--topinfo-height));
            padding: 40px;
            box-sizing: border-box;
        }

        .leave-page-inner {
            max-width: 1200px;
            margin: 0 auto;
        }

        .leave-heading-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 20px;
            margin-bottom: 30px;
        }

        .leave-heading-row h1 {
            margin: 6px 0 8px;
        }

        .leave-heading-row p {
            margin: 0;
            color: #666;
        }

        .leave-apply-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 13px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            background: #222;
            color: #fff;
            white-space: nowrap;
        }

        .leave-summary {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 32px;
        }

        .leave-summary-card {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 22px;
        }

        .leave-summary-label {
            display: block;
            margin-bottom: 12px;
            color: #777;
            font-size: 14px;
        }

        .leave-summary-value {
            font-size: 27px;
            font-weight: 700;
        }

        .leave-history-card {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            overflow: hidden;
        }

        .leave-history-header {
            padding: 22px 24px;
            border-bottom: 1px solid #e5e7eb;
        }

        .leave-history-header h2 {
            margin: 0;
        }

        .leave-table {
            width: 100%;
            border-collapse: collapse;
        }

        .leave-table th,
        .leave-table td {
            padding: 16px 18px;
            text-align: center;
            border-bottom: 1px solid #eeeeee;
        }

        .leave-table th {
            background: #f8f9fa;
            font-size: 14px;
            color: #555;
        }

        .leave-table tbody tr:last-child td {
            border-bottom: 0;
        }

        .leave-status {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            background: #f1f3f5;
        }

        .leave-status--approved {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .leave-status--progress {
            background: #fff3e0;
            color: #e65100;
        }

        .leave-status--rejected {
            background: #ffebee;
            color: #c62828;
        }

        .leave-status--draft {
            background: #eeeeee;
            color: #555;
        }

        .empty-history {
            padding: 60px 20px;
            text-align: center;
            color: #888;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #555;
            text-decoration: none;
        }

        @media (max-width: 900px) {

            .leave-summary {
                grid-template-columns: repeat(2, 1fr);
            }

            .leave-heading-row {
                align-items: flex-start;
                flex-direction: column;
            }

            .leave-history-card {
                overflow-x: auto;
            }

            .leave-table {
                min-width: 700px;
            }
        }

    </style>

</head>


<body class="workspace-home workspace-business business-commute">


<a
        class="skip-link"
        href="#business-main">
    본문으로 이동
</a>


<div
        th:replace="~{module/workspace :: userHeader}">
</div>


<div
        th:replace="~{module/workspace :: sidebar('commute')}">
</div>


<main
        class="leave-page"
        id="business-main">

    <div class="leave-page-inner">


        <!-- 제목 -->
        <div class="leave-heading-row">

            <div>

                <span class="business-eyebrow">
                    MY ANNUAL LEAVE
                </span>

                <h1>
                    연차 관리
                </h1>

                <p>
                    나의 연차 현황과 신청 내역을 확인할 수 있습니다.
                </p>

            </div>


            <!-- 기존 전자결재 문서 작성 화면으로 이동 -->
            <a
                    class="leave-apply-button"
                    th:href="@{/approvals/write}">
                연차 신청하기
            </a>

        </div>


        <!-- 연차 요약 -->
        <section class="leave-summary">


            <div class="leave-summary-card">

                <span class="leave-summary-label">
                    총 연차
                </span>

                <strong
                        class="leave-summary-value"
                        th:text="${annualLeaveSummary.totalDays} + '일'">
                    15.0일
                </strong>

            </div>


            <div class="leave-summary-card">

                <span class="leave-summary-label">
                    사용 연차
                </span>

                <strong
                        class="leave-summary-value"
                        th:text="${annualLeaveSummary.usedDays} + '일'">
                    0일
                </strong>

            </div>


            <div class="leave-summary-card">

                <span class="leave-summary-label">
                    결재중
                </span>

                <strong
                        class="leave-summary-value"
                        th:text="${annualLeaveSummary.pendingDays} + '일'">
                    0일
                </strong>

            </div>


            <div class="leave-summary-card">

                <span class="leave-summary-label">
                    잔여 연차
                </span>

                <strong
                        class="leave-summary-value"
                        th:text="${annualLeaveSummary.remainingDays} + '일'">
                    15.0일
                </strong>

            </div>


        </section>


        <!-- 연차 신청 내역 -->
        <section class="leave-history-card">

            <div class="leave-history-header">

                <h2>
                    연차 신청 내역
                </h2>

            </div>


            <!-- 신청 내역 있음 -->
            <table
                    class="leave-table"
                    th:if="${!#lists.isEmpty(annualLeaveHistory)}">

                <thead>

                <tr>
                    <th>종류</th>
                    <th>시작일</th>
                    <th>종료일</th>
                    <th>사용일수</th>
                    <th>결재상태</th>
                </tr>

                </thead>


                <tbody>

                <tr
                        th:each="leave : ${annualLeaveHistory}">


                    <!-- 휴가 종류 -->
                    <td>

                        <span
                                th:if="${leave.leaveType.name() == 'ANNUAL'}">
                            연차
                        </span>

                        <span
                                th:if="${leave.leaveType.name() == 'AM_HALF'}">
                            오전 반차
                        </span>

                        <span
                                th:if="${leave.leaveType.name() == 'PM_HALF'}">
                            오후 반차
                        </span>

                    </td>


                    <!-- 시작일 -->
                    <td
                            th:text="${leave.startDate}">
                    </td>


                    <!-- 종료일 -->
                    <td
                            th:text="${leave.endDate}">
                    </td>


                    <!-- 사용일수 -->
                    <td
                            th:text="${leave.leaveDays} + '일'">
                    </td>


                    <!-- 상태 -->
                    <td>


                        <span
                                th:if="${leave.status == 'APPROVED'}"
                                class="leave-status leave-status--approved">
                            승인
                        </span>


                        <span
                                th:if="${leave.status == 'IN_PROGRESS'}"
                                class="leave-status leave-status--progress">
                            결재중
                        </span>


                        <span
                                th:if="${leave.status == 'REJECTED'}"
                                class="leave-status leave-status--rejected">
                            반려
                        </span>


                        <span
                                th:if="${leave.status == 'DRAFT'}"
                                class="leave-status leave-status--draft">
                            임시저장
                        </span>


                    </td>

                </tr>

                </tbody>

            </table>


            <!-- 신청 내역 없음 -->
            <div
                    class="empty-history"
                    th:if="${#lists.isEmpty(annualLeaveHistory)}">

                아직 연차 신청 내역이 없습니다.

            </div>

        </section>


        <a
                class="back-link"
                th:href="@{/commute}">
            ← 근태 관리로 돌아가기
        </a>


    </div>

</main>


</body>
</html>
