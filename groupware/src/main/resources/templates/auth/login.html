<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>로그인</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 80px 16px;
            background: #f4f5f7;
            font-family: "Malgun Gothic", sans-serif;
        }

        .login-box {
            max-width: 400px;
            margin: 0 auto;
            padding: 32px;
            background: white;
            border-radius: 12px;
        }

        h1 { margin-top: 0; color: #1b2a4e; }

        label {
            display: block;
            margin: 16px 0 6px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #1b2a4e;
            color: white;
            cursor: pointer;
        }

        .error { color: #c62828; font-size: 14px; }
        .signup { margin-top: 20px; text-align: center; }
        .signup a { color: #1b2a4e; font-weight: bold; }
    </style>
</head>

<body>
<main class="login-box">
    <h1>로그인</h1>

    <p class="error" role="alert" th:if="${param.error != null}">
        로그인할 수 없습니다. 아이디와 비밀번호를 확인해주세요.
    </p>

    <form th:action="@{/login}" method="post">
        <label for="username">아이디</label>
        <input type="text"
               id="username"
               name="username"
               autocomplete="username"
               required>

        <label for="password">비밀번호</label>
        <input type="password"
               id="password"
               name="password"
               autocomplete="current-password"
               required>

        <button type="submit">로그인</button>
    </form>

    <div class="signup">
        계정이 없으신가요?
        <a th:href="@{/register}">회원가입</a>
    </div>
</main>
</body>
</html>
