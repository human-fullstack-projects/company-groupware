<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>로그인</title>

    <link rel="stylesheet" th:href="@{/css/auth.css}" href="../../../../../../../../../../../Users/human/Documents/Codex/2026-09-03/referenced-chatgpt-conversation-this-is-an/outputs/ui-refresh/resources/static/css/auth.css">
</head>

<body class="auth-page login-page"><div class="auth-layout"><aside class="auth-story" aria-label="사내 메신저 소개">
<a class="brand" th:href="@{/}" href="../../../../../../../../../../../Users/human/Documents/Codex/2026-09-03/referenced-chatgpt-conversation-this-is-an/outputs/ui-refresh/resources/templates/home.html"><span class="brand-mark" aria-hidden="true">C</span> COMPANY TALK</a>
<div class="story-copy"><span class="eyebrow">OUR CONNECTED WORKPLACE</span><h2>함께 일하는 하루,<br>더 가까워지도록.</h2><p>대화부터 일정, 업무 공유까지.<br>우리 팀의 하루를 한곳에서 시작하세요.</p></div>
<div class="story-note"><span class="note-label">TEAMWORK, SIMPLIFIED</span><div class="note-line"><span>01</span> 동료와 나누는 빠른 대화</div><div class="note-line"><span>02</span> 함께 확인하는 업무 일정</div><div class="note-line"><span>03</span> 놓치지 않는 팀 소식</div></div>
<p class="story-footer">우리 팀을 연결하는 업무 공간</p></aside>
<main class="auth-panel" id="main-content"><div class="auth-form-wrap"><span class="eyebrow">WELCOME BACK</span>
    <h1>다시 만나 반가워요</h1><p class="description">아이디와 비밀번호를 입력해 업무 공간에 접속하세요.</p>

    <p class="error" role="alert" th:if="${param.error != null}">
        로그인할 수 없습니다. 아이디와 비밀번호를 확인해주세요.
    </p>

    <form th:action="@{/login}" method="post">
        <div class="field"><label for="username">아이디</label>
        <input type="text"
               id="username"
               name="username"
               autocomplete="username"
               required></div>

        <div class="field"><label for="password">비밀번호</label>
        <input type="password"
               id="password"
               name="password"
               autocomplete="current-password"
               required></div>

        <button type="submit">로그인</button>
    </form>

</div></main></div>
</body>
</html>
