<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>회원가입</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 40px 16px;
            background: #f4f5f7;
            font-family: "Malgun Gothic", sans-serif;
        }

        .register-box {
            max-width: 420px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 12px;
            background: white;
        }

        h1 { margin-top: 0; color: #1b2a4e; }

        label {
            display: block;
            margin: 16px 0 6px;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background-color: white;
        }

        input:disabled { background: #eee; }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #1b2a4e;
            color: white;
            cursor: pointer;
        }

        .error { color: #c62828; }
        .description { color: #666; font-size: 13px; }
        .links { margin-top: 20px; text-align: center; }
        a { color: #1b2a4e; }
    </style>
</head>

<body>
<main class="register-box">
    <h1>회원가입</h1>
    <p class="description">회원 정보를 입력하고 부서와 직급을 선택해주세요.</p>

    <p class="error"
       role="alert"
       th:if="${errorMessage != null}"
       th:text="${errorMessage}">
    </p>

    <form th:action="@{/register}" method="post">
        <label for="loginId">아이디</label>
        <input type="text"
               id="loginId"
               name="loginId"
               th:value="${loginId}"
               autocomplete="username"
               maxlength="50"
               required>

        <label for="password">비밀번호</label>
        <input type="password"
               id="password"
               name="password"
               autocomplete="new-password"
               required>

        <label for="passwordConfirm">비밀번호 확인</label>
        <input type="password"
               id="passwordConfirm"
               name="passwordConfirm"
               autocomplete="new-password"
               required>

        <label for="emplName">이름</label>
        <input type="text"
               id="emplName"
               name="emplName"
               th:value="${emplName}"
               autocomplete="name"
               maxlength="50"
               required>

        <label for="emplEmail">이메일</label>
        <input type="email"
               id="emplEmail"
               name="emplEmail"
               th:value="${emplEmail}"
               autocomplete="email"
               maxlength="50"
               required>

        <label for="emplPhone">전화번호</label>
        <input type="tel"
               id="emplPhone"
               name="emplPhone"
               th:value="${emplPhone}"
               autocomplete="tel"
               inputmode="numeric"
               placeholder="010-1234-5678"
               maxlength="13"
               pattern="010-[0-9]{4}-[0-9]{4}"
               title="010으로 시작하는 휴대전화 번호를 입력해주세요."
               required>

        <label for="departmentId">부서</label>
        <select id="departmentId" name="departmentId" required>
            <option value="">부서를 선택해주세요</option>

            <option th:each="department : ${departments}"
                    th:value="${department.deptId}"
                    th:text="${department.deptName}"
                    th:selected="${department.deptId == departmentId}">
            </option>
        </select>

        <label for="gradeId">직급</label>
        <select id="gradeId" name="gradeId" required>
            <option value="">직급을 선택해주세요</option>

            <option th:each="grade : ${grades}"
                    th:value="${grade.gradeId}"
                    th:text="${grade.gradeName}"
                    th:selected="${grade.gradeId == gradeId}">
            </option>
        </select>

        <button type="submit">회원가입</button>
    </form>

    <div class="links">
        <a th:href="@{/login}">로그인</a>
        ·
        <a th:href="@{/}">홈으로</a>
    </div>
</main>
<script>
    const phoneInput = document.getElementById('emplPhone');

    function formatPhone() {
        const numbers = phoneInput.value.replace(/\D/g, '').slice(0, 11);

        if (numbers.length <= 3) {
            phoneInput.value = numbers;
        } else if (numbers.length <= 7) {
            phoneInput.value =
                numbers.slice(0, 3) + '-' + numbers.slice(3);
        } else {
            phoneInput.value =
                numbers.slice(0, 3) + '-' +
                numbers.slice(3, 7) + '-' +
                numbers.slice(7);
        }
    }

    phoneInput.addEventListener('input', formatPhone);

    // 가입 실패 후 다시 표시되는 번호에도 적용
    formatPhone();
</script>
</body>
</html>
