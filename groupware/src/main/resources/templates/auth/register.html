<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>회원가입</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 40px 16px;
            background: #f4f5f7;
            font-family: "Malgun Gothic", sans-serif;
        }

        .register-box {
            max-width: 420px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 12px;
            background: white;
        }

        h1 { margin-top: 0; color: #1b2a4e; }

        label {
            display: block;
            margin: 16px 0 6px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        input:disabled { background: #eee; }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #1b2a4e;
            color: white;
            cursor: pointer;
        }

        .error { color: #c62828; }
        .description { color: #666; font-size: 13px; }
        .links { margin-top: 20px; text-align: center; }
        a { color: #1b2a4e; }
    </style>
</head>

<body>
<main class="register-box">
    <h1>회원가입</h1>
    <p class="description">부서와 직급은 관리자가 지정합니다.</p>

    <p class="error"
       role="alert"
       th:if="${errorMessage != null}"
       th:text="${errorMessage}">
    </p>

    <form th:action="@{/register}" method="post">
        <label for="loginId">아이디</label>
        <input type="text"
               id="loginId"
               name="loginId"
               th:value="${loginId}"
               autocomplete="username"
               maxlength="50"
               required>

        <label for="password">비밀번호</label>
        <input type="password"
               id="password"
               name="password"
               autocomplete="new-password"
               required>

        <label for="passwordConfirm">비밀번호 확인</label>
        <input type="password"
               id="passwordConfirm"
               name="passwordConfirm"
               autocomplete="new-password"
               required>

        <label for="emplName">이름</label>
        <input type="text"
               id="emplName"
               name="emplName"
               th:value="${emplName}"
               autocomplete="name"
               maxlength="50"
               required>

        <label for="emplEmail">이메일</label>
        <input type="email"
               id="emplEmail"
               name="emplEmail"
               th:value="${emplEmail}"
               autocomplete="email"
               maxlength="50"
               required>

        <label for="emplPhone">전화번호</label>
        <input type="tel"
               id="emplPhone"
               name="emplPhone"
               th:value="${emplPhone}"
               autocomplete="tel"
               placeholder="010-1234-5678"
               maxlength="50"
               required>

        <label for="department">부서</label>
        <input type="text"
               id="department"
               value="관리자 지정"
               disabled>

        <label for="grade">직급</label>
        <input type="text"
               id="grade"
               value="관리자 지정"
               disabled>

        <button type="submit">회원가입</button>
    </form>

    <div class="links">
        <a th:href="@{/login}">로그인</a>
        ·
        <a th:href="@{/}">홈으로</a>
    </div>
</main>
</body>
</html>

<!--일단 대충 만든 회원가입 창-->
