<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>직원 등록 | COMPANY TALK</title>

    <link rel="stylesheet" th:href="@{/css/auth.css}" href="../../../../../../../../../../../Users/human/Documents/Codex/2026-09-03/referenced-chatgpt-conversation-this-is-an/outputs/ui-refresh/resources/static/css/auth.css">
</head>

<body class="auth-page register-page"><div class="auth-layout"><aside class="auth-story" aria-label="사내 메신저 소개">
<a class="brand" th:href="@{/}" href="../../../../../../../../../../../Users/human/Documents/Codex/2026-09-03/referenced-chatgpt-conversation-this-is-an/outputs/ui-refresh/resources/templates/home.html"><span class="brand-mark" aria-hidden="true">C</span> COMPANY TALK</a>
<div class="story-copy"><span class="eyebrow">OUR CONNECTED WORKPLACE</span><h2>함께 일하는 하루,<br>더 가까워지도록.</h2><p>대화부터 일정, 업무 공유까지.<br>우리 팀의 하루를 한곳에서 시작하세요.</p></div>
<div class="story-note"><span class="note-label">TEAMWORK, SIMPLIFIED</span><div class="note-line"><span>01</span> 동료와 나누는 빠른 대화</div><div class="note-line"><span>02</span> 함께 확인하는 업무 일정</div><div class="note-line"><span>03</span> 놓치지 않는 팀 소식</div></div>
<p class="story-footer">우리 팀을 연결하는 업무 공간</p></aside>
<main class="auth-panel" id="main-content"><div class="auth-form-wrap"><span class="eyebrow">EMPLOYEE REGISTRATION</span>
    <h1>직원 등록</h1>
    <p class="description">등록할 직원의 정보를 입력하고 부서와 직급을 선택해주세요.</p>

    <p class="error"
       role="alert"
       th:if="${errorMessage != null}"
       th:text="${errorMessage}">
    </p>

    <form th:action="@{/register}" method="post">
        <div class="field"><label for="loginId">아이디</label>
        <input type="text"
               id="loginId"
               name="loginId"
               th:value="${loginId}"
               autocomplete="username"
               maxlength="50"
               required></div>

        <div class="field"><label for="password">비밀번호</label>
        <input type="password"
               id="password"
               name="password"
               autocomplete="new-password"
               required></div>

        <div class="field"><label for="passwordConfirm">비밀번호 확인</label>
        <input type="password"
               id="passwordConfirm"
               name="passwordConfirm"
               autocomplete="new-password"
               required></div>

        <div class="field"><label for="emplName">이름</label>
        <input type="text"
               id="emplName"
               name="emplName"
               th:value="${emplName}"
               autocomplete="name"
               maxlength="50"
               required></div>

        <div class="field"><label for="emplEmail">이메일</label>
        <input type="email"
               id="emplEmail"
               name="emplEmail"
               th:value="${emplEmail}"
               autocomplete="email"
               maxlength="50"
               required></div>

        <div class="field"><label for="emplPhone">전화번호</label>
        <input type="tel"
               id="emplPhone"
               name="emplPhone"
               th:value="${emplPhone}"
               autocomplete="tel"
               inputmode="numeric"
               placeholder="010-1234-5678"
               maxlength="13"
               pattern="010-[0-9]{4}-[0-9]{4}"
               title="010으로 시작하는 휴대전화 번호를 입력해주세요."
               required></div>

        <div class="field"><label for="departmentId">부서</label>
        <select id="departmentId" name="departmentId" required>
            <option value="">부서를 선택해주세요</option>

            <option th:each="department : ${departments}"
                    th:value="${department.deptId}"
                    th:text="${department.deptName}"
                    th:selected="${department.deptId == departmentId}">
            </option>
        </select></div>

        <div class="field"><label for="gradeId">직급</label>
        <select id="gradeId" name="gradeId" required>
            <option value="">직급을 선택해주세요</option>

            <option th:each="grade : ${grades}"
                    th:value="${grade.gradeId}"
                    th:text="${grade.gradeName}"
                    th:selected="${grade.gradeId == gradeId}">
            </option>
        </select></div>

        <button type="submit">직원 등록하기</button>
    </form>

    <div class="links">
        <a th:href="@{/login}" href="login.html">로그인</a>
        ·
        <a th:href="@{/}" href="../../../../../../../../../../../Users/human/Documents/Codex/2026-09-03/referenced-chatgpt-conversation-this-is-an/outputs/ui-refresh/resources/templates/home.html">홈으로</a>
    </div>
</div></main></div>
<script>
    const phoneInput = document.getElementById('emplPhone');

    function formatPhone() {
        const numbers = phoneInput.value.replace(/\D/g, '').slice(0, 11);

        if (numbers.length <= 3) {
            phoneInput.value = numbers;
        } else if (numbers.length <= 7) {
            phoneInput.value =
                numbers.slice(0, 3) + '-' + numbers.slice(3);
        } else {
            phoneInput.value =
                numbers.slice(0, 3) + '-' +
                numbers.slice(3, 7) + '-' +
                numbers.slice(7);
        }
    }

    phoneInput.addEventListener('input', formatPhone);

    // 가입 실패 후 다시 표시되는 번호에도 적용
    formatPhone();
</script>
</body>
</html>
