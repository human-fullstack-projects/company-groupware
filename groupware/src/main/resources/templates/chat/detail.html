<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <meta name="_login_empl_id" th:content="${loginEmplId}">
    <meta name="_room_id" th:content="${chatRoom.roomId}">
    <title th:text="${chatRoom.roomName}">채팅방</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/topinfo.css}">
    <link rel="stylesheet" th:href="@{/css/menubar.css}">
    <link rel="stylesheet" th:href="@{/css/chat-detail.css}">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body>
<div th:replace="~{module/topinfo :: topinfo}"></div>
<div th:replace="~{module/menubar :: menubar}"></div>

<main class="chat-detail">
    <div class="chat-detail__header">
        <a th:href="@{/chat/list}" class="chat-detail__back">← 목록으로</a>
        <h2 class="chat-detail__title" th:text="${chatRoom.roomId} + ' - ' + ${chatRoom.roomName}">채팅방</h2>
        <span id="status" class="chat-detail__status disconnected">연결 중...</span>
        <button type="button" id="inviteBtn" class="chat-detail__invite-btn" onclick="inviteMember()">초대</button>
        <button type="button" id="leaveBtn" class="chat-detail__leave-btn" onclick="leaveRoom()">나가기</button>
    </div>

    <div class="chat-detail__body">
        <aside class="chat-detail__participants">
            <h3 class="chat-detail__participants-title">참여자</h3>
            <ul id="participantList" class="chat-detail__participant-list"></ul>
        </aside>

        <div class="chat-detail__main">
            <ul id="messages" class="chat-detail__messages"></ul>

            <div id="errorLog" class="chat-detail__error" style="display:none;"></div>

            <form id="sendForm" class="chat-detail__send-row">
                <input type="text" id="content" class="chat-detail__input" placeholder="메시지 입력" autocomplete="off">
                <input type="file" id="fileInput" class="chat-detail__file-input" multiple>
                <button type="submit" class="chat-detail__send-btn">전송</button>
            </form>
        </div>
    </div>
</main>

<script th:inline="none">
    let stompClient = null;
    let reconnectTimer = null;
    const RECONNECT_INITIAL_DELAY = 1000;
    const RECONNECT_MAX_DELAY = 30000;
    let reconnectDelay = RECONNECT_INITIAL_DELAY;

    function emplId() {
        return document.querySelector('meta[name="_login_empl_id"]').content;
    }
    function roomId() {
        return document.querySelector('meta[name="_room_id"]').content;
    }

    function csrfHeader() {
        const token = document.querySelector('meta[name="_csrf"]').content;
        const header = document.querySelector('meta[name="_csrf_header"]').content;
        return { [header]: token };
    }

    // 이름으로 직원 검색 (부분 일치, 여러 명이면 목록에서 선택)
    async function findEmplIdByName(name) {
        const res = await fetch('/api/employees/search?name=' + encodeURIComponent(name));
        if (!res.ok) {
            throw new Error(name + ' 검색 실패');
        }
        const candidates = await res.json();
        if (candidates.length === 0) {
            throw new Error('"' + name + '"와 일치하는 직원이 없습니다.');
        }
        if (candidates.length === 1) {
            return candidates[0].emplId;
        }
        const listText = candidates
            .map((c, i) => (i + 1) + '. ' + c.emplName + (c.deptName ? ' (' + c.deptName + ')' : '') + ' - emplId:' + c.emplId)
            .join('\n');
        const picked = prompt('"' + name + '"와 일치하는 직원이 여러 명입니다. 번호를 선택하세요\n' + listText, '1');
        const idx = Number(picked) - 1;
        if (!(idx >= 0 && idx < candidates.length)) {
            throw new Error('선택이 취소되었습니다.');
        }
        return candidates[idx].emplId;
    }

    // 현재 방에 직원 초대
    async function inviteMember() {
        const inviteInput = prompt('초대할 직원 이름을 쉼표로 구분해 입력하세요 (예: 홍길동,김철수)', '');
        const inviteNames = (inviteInput || '')
            .split(',')
            .map(s => s.trim())
            .filter(s => s.length > 0);
        if (inviteNames.length === 0) {
            return;
        }

        let inviteIds;
        try {
            inviteIds = await Promise.all(inviteNames.map(findEmplIdByName));
        } catch (e) {
            alert(e.message);
            return;
        }

        for (const id of inviteIds) {
            const res = await fetch(`/api/chat/rooms/${roomId()}/members`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', ...csrfHeader() },
                body: JSON.stringify({ emplId: id })
            });
            if (!res.ok) {
                const err = await res.json();
                alert('초대 실패 (emplId:' + id + '): ' + (err.message || res.status));
            }
        }
        loadMembers();
    }

    // 현재 방에서 나가기
    async function leaveRoom() {
        if (!confirm('채팅방에서 나가시겠습니까?')) {
            return;
        }

        const res = await fetch(`/api/chat/rooms/${roomId()}/members/${emplId()}`, {
            method: 'DELETE',
            headers: csrfHeader()
        });

        if (!res.ok) {
            const err = await res.json();
            alert('나가기 실패: ' + (err.message || res.status));
            return;
        }

        location.href = '/chat/list';
    }

    let lastMessageDate = null; // 마지막으로 렌더링한 메시지의 날짜(YYYY-MM-DD)

    function toDateKey(date) {
        return date.getFullYear() + '-' + (date.getMonth() + 1) + '-' + date.getDate();
    }

    const IMAGE_EXTENSIONS = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp', 'svg'];

    function isImageFile(fileName) {
        const dot = (fileName || '').lastIndexOf('.');
        if (dot === -1) {
            return false;
        }
        const ext = fileName.slice(dot + 1).toLowerCase();
        return IMAGE_EXTENSIONS.includes(ext);
    }

    function formatFileSize(bytes) {
        if (bytes == null) {
            return '';
        }
        if (bytes < 1024) {
            return bytes + 'B';
        }
        if (bytes < 1024 * 1024) {
            return (bytes / 1024).toFixed(1) + 'KB';
        }
        return (bytes / (1024 * 1024)).toFixed(1) + 'MB';
    }

    function appendMessage(msg) {
        const list = document.getElementById('messages');
        const created = msg.createdAt ? new Date(msg.createdAt) : new Date();

        const dateKey = toDateKey(created);
        if (dateKey !== lastMessageDate) {
            const divider = document.createElement('li');
            divider.className = 'chat-detail__date-divider';
            divider.textContent = created.toLocaleDateString('ko-KR', {
                year: 'numeric', month: 'long', day: 'numeric'
            });
            list.appendChild(divider);
            lastMessageDate = dateKey;
        }

        const li = document.createElement('li');
        if (String(msg.emplId) === emplId()) {
            li.className = 'chat-detail__message--mine';
        }
        const time = created.toLocaleTimeString('ko-KR', {hour: '2-digit', minute:'2-digit'});

        const meta = document.createElement('span');
        meta.className = 'chat-detail__meta';
        meta.textContent = '[' + time + '] ' + msg.emplName;
        li.appendChild(meta);

        if (msg.files && msg.files.length > 0) {
            msg.files.forEach(file => {
                const url = file.downloadUrl + '?emplId=' + encodeURIComponent(emplId());

                const link = document.createElement('a');
                link.className = 'chat-detail__file-link';
                link.href = url;
                link.textContent = '📎 ' + file.fileName + ' (' + formatFileSize(file.fileSize) + ')';
                li.appendChild(link);

                if (isImageFile(file.fileName)) {
                    const preview = document.createElement('a');
                    preview.href = url;
                    preview.target = '_blank';
                    const img = document.createElement('img');
                    img.className = 'chat-detail__file-image';
                    img.src = url;
                    img.alt = file.fileName;
                    preview.appendChild(img);
                    li.appendChild(preview);
                }
            });
        } else {
            li.appendChild(document.createTextNode(msg.content));
        }

        list.appendChild(li);
        list.scrollTop = list.scrollHeight;
    }

    function appendError(err) {
        const box = document.getElementById('errorLog');
        box.style.display = 'block';
        box.textContent = err.message || JSON.stringify(err);
    }

    async function loadHistory() {
        lastMessageDate = null; // 새로 그릴 때 날짜 추적 초기화
        // const res = await fetch(`/api/chat/rooms/${roomId()}/messages`);
        const res = await fetch(`/api/chat/rooms/${roomId()}/messages?emplId=${emplId()}`);
        const history = await res.json();
        document.getElementById('messages').innerHTML = '';
        history.forEach(appendMessage);
    }

    async function loadMembers() {
        const res = await fetch(`/api/chat/rooms/${roomId()}/members`);
        const members = await res.json();
        const list = document.getElementById('participantList');
        list.innerHTML = '';
        members.forEach(m => {
            const li = document.createElement('li');
            li.className = 'chat-detail__participant-item';
            li.textContent = m.emplName;
            list.appendChild(li);
        });
    }

    function connect() {
        const socket = new SockJS(`/ws?emplId=${emplId()}`);
        stompClient = Stomp.over(socket);

        stompClient.connect({}, function () {
            reconnectDelay = RECONNECT_INITIAL_DELAY; // 연결 성공 시 재시도 간격 초기화

            document.getElementById('status').textContent = '연결됨';
            document.getElementById('status').className = 'chat-detail__status connected';

            // 이 방(roomId)만 구독 - 목록 화면이 아니라 방 하나를 위한 전용 화면이라 방 이동 개념이 없음
            stompClient.subscribe(`/topic/room/${roomId()}`, function (frame) {
                appendMessage(JSON.parse(frame.body));
            });

            stompClient.subscribe('/user/queue/errors', function (frame) {
                appendError(JSON.parse(frame.body));
            });

            loadHistory();
            loadMembers();
        }, function (error) {
            appendError({ message: '연결 끊김: ' + error });
            document.getElementById('status').textContent = '재연결 중...';
            document.getElementById('status').className = 'chat-detail__status disconnected';
            scheduleReconnect();
        });
    }

    // 지수 백오프로 재연결 예약 (1s -> 2s -> 4s ... 최대 30s), 중복 예약 방지
    function scheduleReconnect() {
        if (reconnectTimer !== null) {
            return;
        }
        reconnectTimer = setTimeout(function () {
            reconnectTimer = null;
            connect();
        }, reconnectDelay);
        reconnectDelay = Math.min(reconnectDelay * 2, RECONNECT_MAX_DELAY);
    }

    async function uploadFiles(files) {
        const formData = new FormData();
        formData.append('emplId', emplId());
        for (const file of files) {
            formData.append('files', file);
        }

        const res = await fetch(`/api/chat/rooms/${roomId()}/files`, {
            method: 'POST',
            headers: csrfHeader(),
            body: formData
        });

        if (!res.ok) {
            const err = await res.json();
            appendError({ message: '파일 업로드 실패: ' + (err.message || res.status) });
        }
    }

    async function sendMessage(event) {
        event.preventDefault();
        const fileInput = document.getElementById('fileInput');
        if (fileInput.files.length > 0) {
            await uploadFiles(fileInput.files);
            fileInput.value = '';
            return;
        }

        if (stompClient === null) {
            appendError({ message: '아직 연결되지 않았습니다. 잠시 후 다시 시도해주세요.' });
            return;
        }
        const input = document.getElementById('content');
        const content = input.value.trim();
        if (content.length === 0) {
            return;
        }
        stompClient.send('/app/chat.send', {}, JSON.stringify({
            roomId: Number(roomId()),
            content: content
        }));
        input.value = '';
    }

    document.getElementById('sendForm').addEventListener('submit', sendMessage);

    // 이 화면에 들어오면 바로 연결 (뒤로가기/새로고침으로 나가면 브라우저가 소켓을 자동으로 정리함)
    window.addEventListener('load', connect);
</script>
</body>
</html>
