<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <meta name="_login_empl_id" th:content="${loginEmplId}">
    <meta name="_room_id" th:content="${chatRoom.roomId}">
    <title th:text="${chatRoom.roomName}">채팅방</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/topinfo.css}">
    <link rel="stylesheet" th:href="@{/css/menubar.css}">
    <link rel="stylesheet" th:href="@{/css/chat-detail.css}">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/chat-workspace.css}">
</head>
<body class="workspace-home workspace-chat">
<a class="skip-link" href="#workspace-main">본문으로 이동</a>
<div th:replace="~{module/workspace :: header}"></div>
<div th:replace="~{module/workspace :: sidebar('chat')}"></div>

<main class="chat-detail" id="workspace-main">
    <div class="chat-detail__header">
        <a th:href="@{/chat/list}" class="chat-detail__back">← 목록으로</a>
        <div class="chat-detail__heading"><span class="chat-eyebrow">TEAM CONVERSATION</span>
        <h1 class="chat-detail__title" th:text="${chatRoom.roomName}">채팅방</h1></div>
        <span id="status" role="status" class="chat-detail__status disconnected">연결 중...</span>
        <button type="button" id="inviteBtn" class="chat-detail__invite-btn" onclick="inviteMember()">동료 초대</button>
        <button type="button" id="leaveBtn" class="chat-detail__leave-btn" onclick="leaveRoom()">나가기</button>
    </div>

    <div class="chat-detail__body">
        <aside class="chat-detail__participants">
            <h3 class="chat-detail__participants-title">참여자</h3>
            <ul id="participantList" class="chat-detail__participant-list"></ul>
        </aside>

        <div class="chat-detail__main">
            <ul id="messages" aria-label="대화 내용" class="chat-detail__messages"></ul>

            <div id="errorLog" role="alert" class="chat-detail__error" style="display:none;"></div>

            <form id="sendForm" class="chat-detail__send-row">
                <input type="text" id="content" aria-label="메시지 입력" class="chat-detail__input" placeholder="메시지 입력" autocomplete="off">
                <input type="file" id="fileInput" aria-label="첨부할 파일 선택" class="chat-detail__file-input" multiple>
                <button type="submit" class="chat-detail__send-btn">전송</button>
            </form>
        </div>
    </div>
</main>

<script th:inline="none">
    let stompClient = null;
    let reconnectTimer = null;
    const RECONNECT_INITIAL_DELAY = 1000;
    const RECONNECT_MAX_DELAY = 30000;
    let reconnectDelay = RECONNECT_INITIAL_DELAY;

    function emplId() {
        return document.querySelector('meta[name="_login_empl_id"]').content;
    }
    function roomId() {
        return document.querySelector('meta[name="_room_id"]').content;
    }

    function csrfHeader() {
        const token = document.querySelector('meta[name="_csrf"]').content;
        const header = document.querySelector('meta[name="_csrf_header"]').content;
        return { [header]: token };
    }

    // 동료 초대 팝업 열기
    function inviteMember() {
        window.open('/chat/invite-popup?roomId=' + roomId(), 'inviteEmployeePopup', 'width=480,height=600');
    }

    // 팝업에서 선택 완료 후 전달한 emplId 목록을 받아 현재 방에 초대
    window.addEventListener('message', async (event) => {
        if (event.origin !== window.location.origin) {
            return;
        }
        if (!event.data || event.data.type !== 'CHAT_INVITE_SELECTED') {
            return;
        }

        const inviteIds = event.data.emplIds || [];
        for (const id of inviteIds) {
            const res = await fetch(`/api/chat/rooms/${roomId()}/members`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', ...csrfHeader() },
                body: JSON.stringify({ emplId: id })
            });
            if (!res.ok) {
                const err = await res.json();
                alert('초대 실패 (emplId:' + id + '): ' + (err.message || res.status));
            }
        }
        loadMembers();
    });

    // 현재 방에서 나가기
    // 응답을 기다리지 않고 바로 이동 - 서버가 브로드캐스트하는 퇴장 메시지를 본인 화면에서
    // 확인한 뒤에야 이동되는 지연을 없앰. keepalive 로 페이지 이동에 요청이 취소되지 않게 함
    function leaveRoom() {
        if (!confirm('채팅방에서 나가시겠습니까?')) {
            return;
        }

        fetch(`/api/chat/rooms/${roomId()}/members/${emplId()}`, {
            method: 'DELETE',
            headers: csrfHeader(),
            keepalive: true
        }).catch(err => console.error('나가기 요청 실패', err));

        location.href = '/chat/list';
    }

    let lastMessageDate = null; // 마지막으로 렌더링한 메시지의 날짜(YYYY-MM-DD)
    let activeMembers = []; // 현재 방의 활성 참여자 [{ emplId(문자열), roomInDate(Date|null) }]
    let readStatus = {}; // emplId(문자열) -> lastReadMessageId
    let lastSentReadId = 0; // 마지막으로 서버에 보고한 읽음 위치 (중복 전송 방지)

    function toDateKey(date) {
        return date.getFullYear() + '-' + (date.getMonth() + 1) + '-' + date.getDate();
    }

    const IMAGE_EXTENSIONS = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp', 'svg'];

    function isImageFile(fileName) {
        const dot = (fileName || '').lastIndexOf('.');
        if (dot === -1) {
            return false;
        }
        const ext = fileName.slice(dot + 1).toLowerCase();
        return IMAGE_EXTENSIONS.includes(ext);
    }

    function formatFileSize(bytes) {
        if (bytes == null) {
            return '';
        }
        if (bytes < 1024) {
            return bytes + 'B';
        }
        if (bytes < 1024 * 1024) {
            return (bytes / 1024).toFixed(1) + 'KB';
        }
        return (bytes / (1024 * 1024)).toFixed(1) + 'MB';
    }

    // messageType 컬럼이 없어 문구로 입장/퇴장 시스템 메시지를 판별 (날짜 구분선과 동일한 방식)
    function isSystemMessage(msg) {
        return (!msg.files || msg.files.length === 0)
            && typeof msg.content === 'string'
            && (msg.content.endsWith('님이 입장했습니다') || msg.content.endsWith('님이 퇴장했습니다'));
    }

    function appendMessage(msg) {
        const list = document.getElementById('messages');
        const created = msg.createdAt ? new Date(msg.createdAt) : new Date();

        const dateKey = toDateKey(created);
        if (dateKey !== lastMessageDate) {
            const divider = document.createElement('li');
            divider.className = 'chat-detail__date-divider';
            divider.textContent = created.toLocaleDateString('ko-KR', {
                year: 'numeric', month: 'long', day: 'numeric'
            });
            list.appendChild(divider);
            lastMessageDate = dateKey;
        }

        if (isSystemMessage(msg)) {
            const systemLi = document.createElement('li');
            systemLi.className = 'chat-detail__date-divider';
            systemLi.textContent = msg.content;
            list.appendChild(systemLi);
            list.scrollTop = list.scrollHeight;
            return;
        }

        const li = document.createElement('li');
        li.dataset.messageId = msg.messageId;
        li.dataset.emplId = msg.emplId;
        li.dataset.createdAt = msg.createdAt || created.toISOString();
        if (String(msg.emplId) === emplId()) {
            li.className = 'chat-detail__message--mine';
        }
        const time = created.toLocaleTimeString('ko-KR', {hour: '2-digit', minute:'2-digit'});

        const meta = document.createElement('span');
        meta.className = 'chat-detail__meta';
        meta.textContent = '[' + time + '] ' + msg.emplName;

        const unreadBadge = document.createElement('span');
        unreadBadge.className = 'chat-detail__unread-badge';
        meta.appendChild(unreadBadge);

        li.appendChild(meta);

        if (msg.files && msg.files.length > 0) {
            msg.files.forEach(file => {
                const url = file.downloadUrl + '?emplId=' + encodeURIComponent(emplId());

                const link = document.createElement('a');
                link.className = 'chat-detail__file-link';
                link.href = url;
                link.textContent = '📎 ' + file.fileName + ' (' + formatFileSize(file.fileSize) + ')';
                li.appendChild(link);

                if (isImageFile(file.fileName)) {
                    const preview = document.createElement('a');
                    preview.href = url;
                    preview.target = '_blank';
                    const img = document.createElement('img');
                    img.className = 'chat-detail__file-image';
                    img.src = url;
                    img.alt = file.fileName;
                    preview.appendChild(img);
                    li.appendChild(preview);
                }
            });
        } else {
            li.appendChild(document.createTextNode(msg.content));
        }

        list.appendChild(li);
        list.scrollTop = list.scrollHeight;
        updateUnreadBadges();
    }

    // senderEmplId를 제외한 활성 참여자 중, 이 메시지가 오간 시점에 이미 참여 중이었고
    // 아직 이 messageId까지 읽지 않은 사람 수 (메시지 이후에 초대된 사람은 대상에서 제외)
    function unreadCountFor(messageId, senderEmplId, messageCreatedAt) {
        return activeMembers.filter(m => {
            if (m.emplId === String(senderEmplId)) {
                return false;
            }
            if (m.roomInDate && messageCreatedAt && m.roomInDate > messageCreatedAt) {
                return false;
            }
            const read = readStatus[m.emplId];
            return read == null || Number(read) < Number(messageId);
        }).length;
    }

    // 현재 렌더링된 메시지들의 안읽음 배지를 읽음 상태 기준으로 다시 계산
    function updateUnreadBadges() {
        document.querySelectorAll('#messages li[data-message-id]').forEach(li => {
            const badge = li.querySelector('.chat-detail__unread-badge');
            if (!badge) {
                return;
            }
            const createdAt = li.dataset.createdAt ? new Date(li.dataset.createdAt) : null;
            const count = unreadCountFor(li.dataset.messageId, li.dataset.emplId, createdAt);
            badge.textContent = count > 0 ? String(count) : '';
        });
    }

    // 서버에 읽음 위치를 보고 (이미 보낸 값보다 작거나 같으면 전송하지 않음)
    async function sendReadReceipt(lastMessageId) {
        const id = Number(lastMessageId);
        if (!id || id <= lastSentReadId) {
            return;
        }
        lastSentReadId = id;
        try {
            await fetch(`/api/chat/rooms/${roomId()}/read`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', ...csrfHeader() },
                body: JSON.stringify({ lastMessageId: id })
            });
        } catch (e) {
            console.error('읽음 처리 실패', e);
        }
    }

    async function loadReadStatus() {
        const res = await fetch(`/api/chat/rooms/${roomId()}/read-status`);
        readStatus = await res.json();
        updateUnreadBadges();
    }

    function appendError(err) {
        const box = document.getElementById('errorLog');
        box.style.display = 'block';
        box.textContent = err.message || JSON.stringify(err);
    }

    // 관리자가 이 방을 강제 삭제했을 때: 입력을 막고 안내 후 목록으로 이동
    function handleRoomClosed(evt) {
        document.getElementById('content').disabled = true;
        document.getElementById('fileInput').disabled = true;
        document.querySelector('.chat-detail__send-btn').disabled = true;
        document.getElementById('leaveBtn').disabled = true;
        document.getElementById('inviteBtn').disabled = true;

        if (stompClient && stompClient.connected) {
            stompClient.disconnect();
        }

        alert(evt.message || '관리자에 의해 채팅방이 삭제되었습니다.');
        location.href = '/chat/list';
    }

    async function loadHistory() {
        lastMessageDate = null; // 새로 그릴 때 날짜 추적 초기화
        // const res = await fetch(`/api/chat/rooms/${roomId()}/messages`);
        const res = await fetch(`/api/chat/rooms/${roomId()}/messages?emplId=${emplId()}`);
        const history = await res.json();
        document.getElementById('messages').innerHTML = '';
        history.forEach(appendMessage);
        if (history.length > 0) {
            sendReadReceipt(history[history.length - 1].messageId);
        }
    }

    async function loadMembers() {
        const res = await fetch(`/api/chat/rooms/${roomId()}/members`);
        const members = await res.json();
        activeMembers = members.map(m => ({
            emplId: String(m.emplId),
            roomInDate: m.roomInDate ? new Date(m.roomInDate) : null
        }));
        const list = document.getElementById('participantList');
        list.innerHTML = '';
        members.forEach(m => {
            const li = document.createElement('li');
            li.className = 'chat-detail__participant-item';
            li.textContent = m.emplName;
            list.appendChild(li);
        });
        updateUnreadBadges();
    }

    function connect() {
        const socket = new SockJS(`/ws?emplId=${emplId()}`);
        stompClient = Stomp.over(socket);

        stompClient.connect({}, function () {
            reconnectDelay = RECONNECT_INITIAL_DELAY; // 연결 성공 시 재시도 간격 초기화

            document.getElementById('status').textContent = '연결됨';
            document.getElementById('status').className = 'chat-detail__status connected';

            // 이 방(roomId)만 구독 - 목록 화면이 아니라 방 하나를 위한 전용 화면이라 방 이동 개념이 없음
            stompClient.subscribe(`/topic/room/${roomId()}`, function (frame) {
                const msg = JSON.parse(frame.body);
                if (msg.type === 'ROOM_CLOSED') {
                    handleRoomClosed(msg);
                    return;
                }
                appendMessage(msg);
                sendReadReceipt(msg.messageId); // 방을 열어둔 채 새 메시지를 받으면 바로 읽은 것으로 처리
                if (isSystemMessage(msg)) {
                    loadMembers(); // 입장/퇴장으로 활성 인원(분모)이 바뀌었으니 목록과 안읽음 수를 다시 계산
                }
            });

            // 다른 접속자의 읽음 위치 갱신 알림 - 이미 렌더링된 메시지들의 안읽음 수를 다시 계산
            stompClient.subscribe(`/topic/room/${roomId()}/read`, function (frame) {
                const evt = JSON.parse(frame.body);
                readStatus[String(evt.emplId)] = evt.lastMessageId;
                updateUnreadBadges();
            });

            stompClient.subscribe('/user/queue/errors', function (frame) {
                appendError(JSON.parse(frame.body));
            });

            loadHistory();
            loadMembers();
            loadReadStatus();
        }, function (error) {
            appendError({ message: '연결 끊김: ' + error });
            document.getElementById('status').textContent = '재연결 중...';
            document.getElementById('status').className = 'chat-detail__status disconnected';
            scheduleReconnect();
        });
    }

    // 지수 백오프로 재연결 예약 (1s -> 2s -> 4s ... 최대 30s), 중복 예약 방지
    function scheduleReconnect() {
        if (reconnectTimer !== null) {
            return;
        }
        reconnectTimer = setTimeout(function () {
            reconnectTimer = null;
            connect();
        }, reconnectDelay);
        reconnectDelay = Math.min(reconnectDelay * 2, RECONNECT_MAX_DELAY);
    }

    async function uploadFiles(files) {
        const formData = new FormData();
        formData.append('emplId', emplId());
        for (const file of files) {
            formData.append('files', file);
        }

        const res = await fetch(`/api/chat/rooms/${roomId()}/files`, {
            method: 'POST',
            headers: csrfHeader(),
            body: formData
        });

        if (!res.ok) {
            const err = await res.json();
            appendError({ message: '파일 업로드 실패: ' + (err.message || res.status) });
        }
    }

    async function sendMessage(event) {
        event.preventDefault();
        const fileInput = document.getElementById('fileInput');
        if (fileInput.files.length > 0) {
            await uploadFiles(fileInput.files);
            fileInput.value = '';
            return;
        }

        if (stompClient === null) {
            appendError({ message: '아직 연결되지 않았습니다. 잠시 후 다시 시도해주세요.' });
            return;
        }
        const input = document.getElementById('content');
        const content = input.value.trim();
        if (content.length === 0) {
            return;
        }
        stompClient.send('/app/chat.send', {}, JSON.stringify({
            roomId: Number(roomId()),
            content: content
        }));
        input.value = '';
    }

    document.getElementById('sendForm').addEventListener('submit', sendMessage);

    // 이 화면에 들어오면 바로 연결 (뒤로가기/새로고침으로 나가면 브라우저가 소켓을 자동으로 정리함)
    window.addEventListener('load', connect);

    // 페이지를 벗어날 때 소켓을 명시적으로 정리 (다른 메뉴로 이동 시 재연결 시도가 뜨는 것을 방지)
    // bfcache에 저장되는 경우(persisted)는 문서가 재사용되므로 연결을 끊지 않음
    window.addEventListener('pagehide', function (event) {
        if (event.persisted) {
            return;
        }
        if (reconnectTimer !== null) {
            clearTimeout(reconnectTimer);
            reconnectTimer = null;
        }
        if (stompClient && stompClient.connected) {
            stompClient.disconnect();
        }
    });

    // bfcache에서 페이지가 복원된 경우 load 이벤트가 다시 발생하지 않으므로 여기서 재연결
    window.addEventListener('pageshow', function (event) {
        if (event.persisted && (!stompClient || !stompClient.connected)) {
            connect();
        }
    });
</script>
</body>
</html>
