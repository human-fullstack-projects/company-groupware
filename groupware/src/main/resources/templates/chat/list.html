<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <meta name="_login_empl_id" th:content="${loginEmplId}">
    <title>메신저</title>
    <link rel="stylesheet" th:href="@{/css/common.css}" href="../static/css/common.css">
    <link rel="stylesheet" th:href="@{/css/topinfo.css}" href="../static/css/topinfo.css">
    <link rel="stylesheet" th:href="@{/css/menubar.css}" href="../static/css/menubar.css">
    <link rel="stylesheet" th:href="@{/css/chat-list.css}">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body>
<div th:replace="~{module/topinfo :: topinfo}"></div>
<div th:replace="~{module/menubar :: menubar}"></div>

<main class="chat-list">
    <aside class="chat-list__sidebar">
        <div class="chat-list__rooms">
            <h2 class="chat-list__heading">소속된 채팅방 리스트</h2>
            <ul id="roomItems" class="chat-list__room-items">
                <li th:each="affiliation : ${chatRoomList}" th:attr="data-room-id=${affiliation.chatRoom.roomId}">
                    <!--<a th:href="@{/chat/detail(roomId=${affiliation.chatRoom.roomId})}"
                       th:text="${affiliation.chatRoom.roomId} + ' - ' + ${affiliation.chatRoom.roomName}"></a>-->
                    <a th:href="@{/chat/detail(roomId=${affiliation.chatRoom.roomId})}"
                       th:text="${affiliation.chatRoom.roomName}"></a>
                </li>
            </ul>
        </div>
        <button type="button" class="chat-list__create-btn" onclick="createRoomWithInvite()">채팅방 생성 +</button>
    </aside>
    <section class="chat-list__content">
        좌측 목록에서 채팅방을 선택하세요.
    </section>
</main>

<script th:inline="none">
    function csrfHeader() {
        const token = document.querySelector('meta[name="_csrf"]').content;
        const header = document.querySelector('meta[name="_csrf_header"]').content;
        return { [header]: token };
    }

    function loginEmplId() {
        return document.querySelector('meta[name="_login_empl_id"]').content;
    }

    // 이름으로 직원 검색 (부분 일치, 여러 명이면 목록에서 선택)
    async function findEmplIdByName(name) {
        const res = await fetch('/api/employees/search?name=' + encodeURIComponent(name));
        if (!res.ok) {
            throw new Error(name + ' 검색 실패');
        }
        const candidates = await res.json();
        if (candidates.length === 0) {
            throw new Error('"' + name + '"와 일치하는 직원이 없습니다.');
        }
        if (candidates.length === 1) {
            return candidates[0].emplId;
        }
        const listText = candidates
            .map((c, i) => (i + 1) + '. ' + c.emplName + (c.deptName ? ' (' + c.deptName + ')' : '') + ' - emplId:' + c.emplId)
            .join('\n');
        const picked = prompt('"' + name + '"와 일치하는 직원이 여러 명입니다. 번호를 선택하세요\n' + listText, '1');
        const idx = Number(picked) - 1;
        if (!(idx >= 0 && idx < candidates.length)) {
            throw new Error('선택이 취소되었습니다.');
        }
        return candidates[idx].emplId;
    }

    // 방 생성 + 초대 (chat-test.html 의 createRoomWithInvite 참조)
    async function createRoomWithInvite() {
        const roomName = prompt('생성할 채팅방 이름을 입력하세요', '새 채팅방');
        if (!roomName) {
            return;
        }
        const inviteInput = prompt('초대할 직원 이름을 쉼표로 구분해 입력하세요 (예: 홍길동,김철수)', '');
        const inviteNames = (inviteInput || '')
            .split(',')
            .map(s => s.trim())
            .filter(s => s.length > 0);

        let inviteIds;
        try {
            inviteIds = await Promise.all(inviteNames.map(findEmplIdByName));
        } catch (e) {
            alert(e.message);
            return;
        }

        const res = await fetch('/api/chat/rooms', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', ...csrfHeader() },
            body: JSON.stringify({
                roomName: roomName,
                creatorEmplId: Number(loginEmplId()),
                memberEmplIds: inviteIds
            })
        });

        if (!res.ok) {
            const err = await res.json();
            alert('방 생성 실패: ' + (err.message || res.status));
            return;
        }

        location.reload();
    }

    // 방 목록 실시간 갱신 (다른 사람이 나를 새 방에 초대했을 때 새로고침 없이 반영)
    let stompClient = null;
    let reconnectTimer = null;
    const RECONNECT_INITIAL_DELAY = 1000;
    const RECONNECT_MAX_DELAY = 30000;
    let reconnectDelay = RECONNECT_INITIAL_DELAY;

    function appendRoom(room) {
        const list = document.getElementById('roomItems');
        if (list.querySelector('[data-room-id="' + room.roomId + '"]')) {
            return; // 이미 목록에 있으면 중복 추가하지 않음
        }
        const li = document.createElement('li');
        li.setAttribute('data-room-id', room.roomId);
        const link = document.createElement('a');
        link.href = '/chat/detail?roomId=' + room.roomId;
        link.textContent = room.roomName;
        li.appendChild(link);
        list.appendChild(li);
    }

    function connect() {
        const socket = new SockJS('/ws?emplId=' + loginEmplId());
        stompClient = Stomp.over(socket);

        stompClient.connect({}, function () {
            reconnectDelay = RECONNECT_INITIAL_DELAY;
            stompClient.subscribe('/user/queue/rooms', function (frame) {
                appendRoom(JSON.parse(frame.body));
            });
        }, function () {
            scheduleReconnect();
        });
    }

    function scheduleReconnect() {
        if (reconnectTimer !== null) {
            return;
        }
        reconnectTimer = setTimeout(function () {
            reconnectTimer = null;
            connect();
        }, reconnectDelay);
        reconnectDelay = Math.min(reconnectDelay * 2, RECONNECT_MAX_DELAY);
    }

    window.addEventListener('load', connect);

    window.addEventListener('pagehide', function (event) {
        if (event.persisted) {
            return;
        }
        if (reconnectTimer !== null) {
            clearTimeout(reconnectTimer);
            reconnectTimer = null;
        }
        if (stompClient && stompClient.connected) {
            stompClient.disconnect();
        }
    });

    window.addEventListener('pageshow', function (event) {
        if (event.persisted && (!stompClient || !stompClient.connected)) {
            connect();
        }
    });
</script>
</body>
</html>
