<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <meta name="_login_empl_id" th:content="${loginEmplId}">
    <meta name="_is_admin" th:content="${isAdmin}">
    <title>메신저</title>
    <link rel="stylesheet" th:href="@{/css/common.css}" href="../static/css/common.css">
    <link rel="stylesheet" th:href="@{/css/topinfo.css}" href="../static/css/topinfo.css">
    <link rel="stylesheet" th:href="@{/css/menubar.css}" href="../static/css/menubar.css">
    <link rel="stylesheet" th:href="@{/css/chat-list.css}">
    <link rel="stylesheet" th:href="@{/css/chat-invite-popup.css}">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/chat-workspace.css}">
</head>
<body class="workspace-home workspace-chat">
<a class="skip-link" href="#workspace-main">본문으로 이동</a>
<div th:replace="~{module/workspace :: header}"></div>
<div th:replace="~{module/workspace :: sidebar('chat')}"></div>

<main class="chat-workspace-content" id="workspace-main">
    <div class="chat-page-heading">
        <span class="chat-eyebrow">TEAM MESSENGER</span>
        <h1>메신저</h1>
        <p>동료와 대화하고, 업무에 필요한 파일을 함께 나누세요.</p>
    </div>
    <div class="chat-list">
    <aside class="chat-list__sidebar">
        <div class="chat-list__rooms">
            <h2 class="chat-list__heading">내 채팅방</h2>
            <ul id="roomItems" class="chat-list__room-items">
                <li th:each="room : ${chatRoomList}" th:attr="data-room-id=${room.roomId}">
                    <a th:href="@{/chat/detail(roomId=${room.roomId})}"
                       th:text="${room.roomName}"></a>
                    <button th:if="${isAdmin}" type="button" class="chat-list__delete-btn"
                            th:attr="data-room-id=${room.roomId}" onclick="deleteRoom(this)">삭제</button>
                </li>
            </ul>
            <p class="chat-list__empty">아직 참여한 채팅방이 없습니다.<br>새 채팅방을 만들어 대화를 시작하세요.</p>
        </div>
        <button type="button" class="chat-list__create-btn" onclick="createRoomWithInvite()">+ 새 채팅방</button>
    </aside>
    <section class="chat-list__content">
        <div class="chat-welcome">
            <div class="chat-welcome__icon" aria-hidden="true">
                <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M38 7H10a5 5 0 0 0-5 5v21a5 5 0 0 0 5 5h5l9 7v-7h14a5 5 0 0 0 5-5V12a5 5 0 0 0-5-5Z"/><path d="M15 18h18M15 26h12"/></svg>
            </div>
            <span class="chat-eyebrow">BETTER TOGETHER</span>
            <h2>대화가 업무의 시작이니까</h2>
            <p>목록에서 채팅방을 선택하거나<br>새 채팅방을 만들어 동료와 연결하세요.</p>
            <div class="chat-welcome__tags"><span>실시간 대화</span><span>파일 공유</span><span>동료 초대</span></div>
        </div>
    </section>
    </div>
</main>

<div th:replace="~{chat/invite-modal :: modal}"></div>

<script th:src="@{/js/chat/chat-invite-modal.js}"></script>
<script th:inline="none">
    function csrfHeader() {
        const token = document.querySelector('meta[name="_csrf"]').content;
        const header = document.querySelector('meta[name="_csrf_header"]').content;
        return { [header]: token };
    }

    function loginEmplId() {
        return document.querySelector('meta[name="_login_empl_id"]').content;
    }

    function isAdmin() {
        return document.querySelector('meta[name="_is_admin"]').content === 'true';
    }

    // 방 이름을 먼저 받은 뒤 동료 초대 모달을 연다
    function createRoomWithInvite() {
        const roomName = prompt('생성할 채팅방 이름을 입력하세요', '새 채팅방');
        if (!roomName) {
            return;
        }
        ChatInvite.open(null, async (emplIds) => {
            const res = await fetch('/api/chat/rooms', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', ...csrfHeader() },
                body: JSON.stringify({
                    roomName: roomName,
                    creatorEmplId: Number(loginEmplId()),
                    memberEmplIds: emplIds
                })
            });

            if (!res.ok) {
                const err = await res.json();
                alert('방 생성 실패: ' + (err.message || res.status));
                return;
            }

            location.reload();
        });
    }

    // 관리자 - 채팅방 강제 삭제(비활성화). 활성 참여자 전원이 강제 퇴장됨
    async function deleteRoom(button) {
        const li = button.closest('li');
        const roomId = li.getAttribute('data-room-id');
        if (!confirm('이 채팅방을 삭제하시겠습니까? 참여 중인 모든 인원이 강제 퇴장됩니다.')) {
            return;
        }

        const res = await fetch('/api/chat/rooms/' + roomId, {
            method: 'DELETE',
            headers: csrfHeader()
        });

        if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            alert('방 삭제 실패: ' + (err.message || res.status));
            return;
        }

        li.remove();
    }

    // 방 목록 실시간 갱신 (다른 사람이 나를 새 방에 초대했을 때 새로고침 없이 반영)
    let stompClient = null;
    let reconnectTimer = null;
    const RECONNECT_INITIAL_DELAY = 1000;
    const RECONNECT_MAX_DELAY = 30000;
    let reconnectDelay = RECONNECT_INITIAL_DELAY;

    function appendRoom(room) {
        const list = document.getElementById('roomItems');
        if (list.querySelector('[data-room-id="' + room.roomId + '"]')) {
            return; // 이미 목록에 있으면 중복 추가하지 않음
        }
        const li = document.createElement('li');
        li.setAttribute('data-room-id', room.roomId);
        const link = document.createElement('a');
        link.href = '/chat/detail?roomId=' + room.roomId;
        link.textContent = room.roomName;
        li.appendChild(link);

        if (isAdmin()) {
            const deleteBtn = document.createElement('button');
            deleteBtn.type = 'button';
            deleteBtn.className = 'chat-list__delete-btn';
            deleteBtn.setAttribute('data-room-id', room.roomId);
            deleteBtn.textContent = '삭제';
            deleteBtn.onclick = function () { deleteRoom(deleteBtn); };
            li.appendChild(deleteBtn);
        }

        list.appendChild(li);
    }

    // 관리자가 이 방을 강제 삭제해서 나도 강제 퇴장됐을 때 목록에서 즉시 제거
    function removeRoom(evt) {
        const list = document.getElementById('roomItems');
        const li = list.querySelector('[data-room-id="' + evt.roomId + '"]');
        if (!li) {
            return; // 본인이 방금 삭제한 경우 등 이미 제거돼 있으면 무시
        }
        li.remove();
        alert(evt.message || '채팅방이 삭제되어 목록에서 제거되었습니다.');
    }

    function connect() {
        const socket = new SockJS('/ws?emplId=' + loginEmplId());
        stompClient = Stomp.over(socket);

        stompClient.connect({}, function () {
            reconnectDelay = RECONNECT_INITIAL_DELAY;
            stompClient.subscribe('/user/queue/rooms', function (frame) {
                appendRoom(JSON.parse(frame.body));
            });
            stompClient.subscribe('/user/queue/rooms/removed', function (frame) {
                removeRoom(JSON.parse(frame.body));
            });
        }, function () {
            scheduleReconnect();
        });
    }

    function scheduleReconnect() {
        if (reconnectTimer !== null) {
            return;
        }
        reconnectTimer = setTimeout(function () {
            reconnectTimer = null;
            connect();
        }, reconnectDelay);
        reconnectDelay = Math.min(reconnectDelay * 2, RECONNECT_MAX_DELAY);
    }

    window.addEventListener('load', connect);

    window.addEventListener('pagehide', function (event) {
        if (event.persisted) {
            return;
        }
        if (reconnectTimer !== null) {
            clearTimeout(reconnectTimer);
            reconnectTimer = null;
        }
        if (stompClient && stompClient.connected) {
            stompClient.disconnect();
        }
    });

    window.addEventListener('pageshow', function (event) {
        if (event.persisted && (!stompClient || !stompClient.connected)) {
            connect();
        }
    });
</script>
</body>
</html>
