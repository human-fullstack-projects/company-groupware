<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>COMPANY TALK 공통 화면</title></head>
<body>
<header class="topinfo" th:fragment="header">
    <h1 class="topinfo__title">
        <a th:href="@{/}"
           style="color: inherit; text-decoration: none;">
            COMPANY TALK
        </a>
    </h1>
    <div class="topinfo__auth">
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="topinfo__login-btn">로그아웃</button>
        </form>
    </div>
</header>
<header class="topinfo" th:fragment="userHeader">
    <h1 class="topinfo__title"><a th:href="@{/}" style="color: inherit; text-decoration: none;">COMPANY TALK</a></h1>
    <div class="topinfo__auth">
        <a th:if="${loginEmployee == null}" th:href="@{/login}" class="topinfo__login-btn">로그인</a>

        <th:block th:if="${loginEmployee != null}">
            <a th:href="@{/mypage}" class="topinfo__login-btn topinfo__user-btn"><span th:text="${loginEmployee.emplName}">이름</span><span class="topinfo__user-id" th:text="'(' + ${loginEmployee.loginId} + ')'">(아이디)</span></a>
            <form th:action="@{/logout}" method="post" style="display:inline;">
                <button type="submit" class="topinfo__login-btn">로그아웃</button>
            </form>
        </th:block>
    </div>
</header>
<aside th:fragment="sidebar(active)" class="menubar ct-sidebar" aria-label="주 메뉴">
    <div class="ct-workspace"><span class="ct-workspace-logo" aria-hidden="true">C</span>
        <div><strong>우리의 업무 공간</strong><span>COMPANY WORKSPACE</span></div>
    </div>
    <nav class="ct-nav" aria-label="업무 메뉴">
        <div class="ct-nav-home"><a class="ct-nav-link" th:classappend="${active == 'home'} ? ' is-active' : ''"
                                    th:attr="aria-current=${active == 'home' ? 'page' : null}" th:href="@{/}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round"
                 stroke-linejoin="round" aria-hidden="true">
                <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>
            </svg>
            <span>홈</span><span class="ct-active-dot" aria-hidden="true" th:if="${active == 'home'}"></span></a></div>
        <section class="ct-nav-group" aria-labelledby="nav-communication"><h2 id="nav-communication">소통</h2><a
                class="ct-nav-link" th:classappend="${active == 'chat'} ? ' is-active' : ''"
                th:attr="aria-current=${active == 'chat' ? 'page' : null}" th:href="@{/chat/list}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round"
                 stroke-linejoin="round" aria-hidden="true">
                <path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5H4l-2 2v-9.5A8.5 8.5 0 0 1 10.5 4H18a3 3 0 0 1 3 3z"/>
                <path d="M7 10h9M7 14h6"/>
            </svg>
            <span>메신저</span><span class="ct-active-dot" aria-hidden="true" th:if="${active == 'chat'}"></span></a><a class="ct-nav-link" th:classappend="${active == 'boards'} ? ' is-active' : ''"
                                   th:attr="aria-current=${active == 'boards' ? 'page' : null}" th:href="@{/boards}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round"
                 stroke-linejoin="round" aria-hidden="true">
                <rect x="4" y="3" width="16" height="18" rx="2"/>
                <path d="M8 8h8M8 12h8M8 16h5"/>
            </svg>
            <span>게시판</span><span class="ct-active-dot" aria-hidden="true" th:if="${active == 'boards'}"></span></a>
        </section>
        <section class="ct-nav-group" aria-labelledby="nav-work"><h2 id="nav-work">업무</h2><a class="ct-nav-link" th:classappend="${active == 'commute'} ? ' is-active' : ''" th:attr="aria-current=${active == 'commute' ? 'page' : null}" th:href="@{/commute}">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>근태 관리</span><span class="ct-active-dot" aria-hidden="true" th:if="${active == 'commute'}"></span></a><a class="ct-nav-link"
                                                                                             th:classappend="${active == 'calendar'} ? ' is-active' : ''"
                                                                                             th:attr="aria-current=${active == 'calendar' ? 'page' : null}"
                                                                                             th:href="@{/calendar}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round"
                 stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="5" width="18" height="16" rx="2"/>
                <path d="M7 3v4M17 3v4M3 10h18M7 14h2M13 14h2M7 17h2"/>
            </svg>
            <span>캘린더</span><span class="ct-active-dot" aria-hidden="true" th:if="${active == 'calendar'}"></span></a><a
                class="ct-nav-link" th:classappend="${active == 'approvals'} ? ' is-active' : ''" th:attr="aria-current=${active == 'approvals' ? 'page' : null}" th:href="@{/approvals}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round"
                 stroke-linejoin="round" aria-hidden="true">
                <path d="M14 3H5v18h14V8zM14 3v5h5M8 14l3 3 5-6"/>
            </svg>
            <span>전자결재</span><span class="ct-active-dot" aria-hidden="true" th:if="${active == 'approvals'}"></span></a><a class="ct-nav-link" th:classappend="${active == 'lines'} ? ' is-active' : ''" th:attr="aria-current=${active == 'lines' ? 'page' : null}" th:href="@{/approval-lines}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round"
                 stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="3" width="6" height="6" rx="1"/>
                <rect x="15" y="15" width="6" height="6" rx="1"/>
                <path d="M9 6h9v5m-3-3 3 3 3-3M15 18H6v-5"/>
            </svg>
            <span>결재라인 관리</span><span class="ct-active-dot" aria-hidden="true" th:if="${active == 'lines'}"></span></a></section>

        <!-- 기존 준비 중 코드를 아래와 같이 a 태그 링크로 변경 -->
        <section class="ct-nav-group" aria-labelledby="nav-organization">
            <h2 id="nav-organization">조직</h2>

            <!-- 직원 조회 -->
            <a class="ct-nav-link" th:classappend="${active == 'employees'} ? ' is-active' : ''"
               th:attr="aria-current=${active == 'employees' ? 'page' : null}" th:href="@{/employees}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="9" cy="7" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M16 4a3 3 0 0 1 0 6M18 14a5 5 0 0 1 3 5v2"/>
                </svg>
                <span>직원 조회</span>
                <span class="ct-active-dot" aria-hidden="true" th:if="${active == 'employees'}"></span>
            </a>

            <!-- 조직도 (준비 중 제거 및 링크 연결) -->
            <a class="ct-nav-link" th:classappend="${active == 'organization'} ? ' is-active' : ''"
               th:attr="aria-current=${active == 'organization' ? 'page' : null}" th:href="@{/organization/chart}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="9" y="2" width="6" height="5" rx="1"/><rect x="2" y="17" width="6" height="5" rx="1"/><rect x="16" y="17" width="6" height="5" rx="1"/><path d="M12 7v5M5 17v-5h14v5"/>
                </svg>
                <span>조직도</span>
                <span class="ct-active-dot" aria-hidden="true" th:if="${active == 'organization'}"></span>
            </a>
        </section>

        <div class="ct-nav-bottom"><a class="ct-nav-link" th:href="@{/mypage}"><svg
                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round"
                stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path
                d="M4 22v-2a8 8 0 0 1 16 0v2"/></svg><span>내 계정</span></a><a class="ct-nav-link"
                                                                                                   th:href="@{/admin}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round"
                 stroke-linejoin="round" aria-hidden="true">
                <path d="m12 2 8 3v6c0 5-8 11-8 11S4 16 4 11V5z"/>
                <path d="m8 11 3 3 5-5"/>
            </svg>
            <span>관리자</span></a>
            <p>함께 연결되는 더 나은 하루</p></div>
    </nav>
</aside>
</body>
</html>
